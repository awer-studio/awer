<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>awer</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;700&family=Roboto:wght@400;500;700&display=swap');
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#1e1f20;--bg2:#2d2e30;--bg3:#3c4043;--text:#e8eaed;--text2:#9aa0a6;
  --border:#3c4043;--accent:#81c995;--accent2:#34a853;--danger:#f28b82;
  --chip:#3c4043;--shadow:0 1px 3px rgba(0,0,0,.3);
  --sidebar-width:280px;
}
html,body{background:var(--bg);color:var(--text);font-family:'Google Sans','Roboto',system-ui,sans-serif;min-height:100vh;font-size:14px;overflow-x:hidden}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,textarea,select{font-family:inherit}

/* БОКОВОЕ МЕНЮ */
.sidebar{position:fixed;left:0;top:0;bottom:0;width:var(--sidebar-width);background:#202124;border-right:1px solid var(--border);z-index:100;display:flex;flex-direction:column;padding:16px 0;overflow-y:auto}
.sidebar-logo{display:flex;align-items:center;gap:12px;padding:8px 24px 24px;font-size:22px;font-weight:700;color:var(--accent)}
.sidebar-logo .logo-icon{width:40px;height:40px;background:linear-gradient(135deg,#4285f4,#34a853,#fbbc05,#ea4335);border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:20px;color:#fff;font-weight:700}
.sidebar-nav{flex:1}
.sidebar-item{display:flex;align-items:center;gap:16px;padding:12px 24px;color:var(--text2);font-size:14px;font-weight:500;cursor:pointer;transition:all .2s;border-radius:0 24px 24px 0;margin-right:8px}
.sidebar-item:hover{background:var(--bg2);color:var(--text)}
.sidebar-item.active{background:rgba(129,201,149,.15);color:var(--accent)}
.sidebar-item .si-icon{font-size:20px;width:24px;text-align:center}
.sidebar-divider{height:1px;background:var(--border);margin:12px 24px}
.sidebar-user{padding:16px 24px;display:flex;align-items:center;gap:12px;border-top:1px solid var(--border)}
.sidebar-user-avatar{width:36px;height:36px;border-radius:50%;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:600;font-size:14px}
.sidebar-user-info{flex:1}
.sidebar-user-name{font-size:14px;font-weight:500;color:var(--text)}
.sidebar-user-role{font-size:11px;color:var(--text2)}

/* ОСНОВНОЙ КОНТЕНТ */
.main{margin-left:var(--sidebar-width);min-height:100vh}

/* ШАПКА */
.topbar{position:sticky;top:0;z-index:50;background:var(--bg);border-bottom:1px solid var(--border);padding:12px 32px;display:flex;align-items:center;gap:16px}
.search-bar{flex:1;max-width:720px;position:relative}
.search-bar input{width:100%;padding:12px 20px 12px 48px;border-radius:24px;border:1px solid var(--border);background:var(--bg2);color:var(--text);font-size:15px;outline:none}
.search-bar input:focus{border-color:var(--accent);background:var(--bg3)}
.search-bar::before{content:"";position:absolute;left:16px;top:50%;transform:translateY(-50%);font-size:18px;opacity:.6}
.topbar-actions{display:flex;align-items:center;gap:12px}
.theme-toggle{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:18px;color:var(--text2);cursor:pointer}
.theme-toggle:hover{background:var(--bg2)}
.auth-btn{padding:10px 24px;border-radius:20px;background:var(--accent);color:#1e1f20;font-weight:600;font-size:14px;cursor:pointer}
.auth-btn:hover{background:var(--accent2)}

/* ВКЛАДКИ */
.page-tabs{display:flex;gap:8px;padding:16px 32px;border-bottom:1px solid var(--border)}
.page-tab{padding:10px 20px;border-radius:20px;font-size:14px;font-weight:500;color:var(--text2);cursor:pointer;transition:all .2s}
.page-tab:hover{background:var(--bg2);color:var(--text)}
.page-tab.active{background:rgba(129,201,149,.15);color:var(--accent)}

/* КОНТЕНТ */
.content{padding:24px 32px 80px}

/* БАННЕР */
.hero-banner{background:linear-gradient(135deg,#1a4731,#2d5a3d,#1a4731);border-radius:16px;padding:48px;margin-bottom:32px;display:flex;align-items:center;gap:32px;position:relative;overflow:hidden}
.hero-banner::before{content:"";position:absolute;top:-50%;right:-20%;width:400px;height:400px;background:radial-gradient(circle,rgba(129,201,149,.2),transparent);border-radius:50%}
.hero-text{flex:1;position:relative;z-index:1}
.hero-badge{display:inline-block;padding:4px 12px;background:rgba(129,201,149,.2);color:var(--accent);border-radius:12px;font-size:12px;font-weight:600;margin-bottom:16px;text-transform:uppercase;letter-spacing:.5px}
.hero-text h1{font-size:36px;font-weight:700;margin-bottom:12px;line-height:1.2}
.hero-text p{font-size:16px;color:var(--text2);margin-bottom:24px;line-height:1.5}
.hero-btn{padding:12px 28px;background:var(--accent);color:#1e1f20;border-radius:24px;font-weight:600;font-size:15px;cursor:pointer;transition:all .2s}
.hero-btn:hover{background:var(--accent2);transform:translateY(-2px)}
.hero-emoji{font-size:120px;position:relative;z-index:1;opacity:.9}

/* СЕКЦИИ */
.section{margin-bottom:32px}
.section-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.section-header h2{font-size:20px;font-weight:600}
.section-header .more{color:var(--accent);font-size:14px;font-weight:500;cursor:pointer;padding:8px 16px;border-radius:16px}
.section-header .more:hover{background:rgba(129,201,149,.1)}

/* КАРУСЕЛЬ */
.carousel{display:flex;gap:16px;overflow-x:auto;padding-bottom:8px;scrollbar-width:none}
.carousel::-webkit-scrollbar{display:none}

/* КАРТОЧКА ПРИЛОЖЕНИЯ (карусель) */
.app-card-h{flex:0 0 160px;cursor:pointer;transition:transform .2s}
.app-card-h:hover{transform:translateY(-4px)}
.app-card-h .app-icon{width:160px;height:160px;border-radius:32px;display:flex;align-items:center;justify-content:center;font-size:72px;margin-bottom:12px;box-shadow:var(--shadow);overflow:hidden}
.app-card-h .app-icon img{width:100%;height:100%;object-fit:cover}
.app-card-h .app-name{font-size:14px;font-weight:500;margin-bottom:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.app-card-h .app-dev{font-size:12px;color:var(--text2);display:flex;align-items:center;gap:4px}

/* СПИСОК ПРИЛОЖЕНИЙ */
.app-list{display:flex;flex-direction:column;gap:8px}
.app-list-item{display:flex;align-items:center;gap:16px;padding:12px 16px;border-radius:12px;cursor:pointer;transition:background .2s}
.app-list-item:hover{background:var(--bg2)}
.app-list-item .app-icon{width:64px;height:64px;border-radius:16px;display:flex;align-items:center;justify-content:center;font-size:32px;flex-shrink:0;overflow:hidden;box-shadow:var(--shadow)}
.app-list-item .app-icon img{width:100%;height:100%;object-fit:cover}
.app-list-item .app-info{flex:1;min-width:0}
.app-list-item .app-name{font-size:15px;font-weight:500;margin-bottom:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.app-list-item .app-meta{font-size:12px;color:var(--text2);display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.app-list-item .app-rating{display:flex;align-items:center;gap:4px}
.app-list-item .app-rating span{color:var(--text2);font-size:12px}
.app-list-item .app-size{color:var(--text2);font-size:12px}

/* СТРАНИЦА ПРИЛОЖЕНИЯ */
.app-page{padding:0}
.app-page-header{display:flex;gap:24px;padding:32px;align-items:flex-start}
.app-page-icon{width:180px;height:180px;border-radius:36px;display:flex;align-items:center;justify-content:center;font-size:90px;box-shadow:var(--shadow);overflow:hidden;flex-shrink:0}
.app-page-icon img{width:100%;height:100%;object-fit:cover}
.app-page-info{flex:1}
.app-page-info h1{font-size:28px;font-weight:700;margin-bottom:8px}
.app-page-dev{font-size:14px;color:var(--accent);font-weight:500;margin-bottom:12px;display:flex;align-items:center;gap:6px}
.official-badge{color:#ffd700;font-size:18px}
.verified-badge{color:var(--accent);font-size:14px}
.app-page-stats{display:flex;gap:32px;padding:16px 0;border-top:1px solid var(--border);border-bottom:1px solid var(--border);margin:16px 0}
.app-stat{text-align:center}
.app-stat .val{font-size:18px;font-weight:600}
.app-stat .lbl{font-size:11px;color:var(--text2);margin-top:4px}
.app-page-actions{display:flex;gap:12px;margin:20px 0;flex-wrap:wrap}
.btn-install{padding:12px 32px;background:var(--accent);color:#1e1f20;border-radius:24px;font-weight:600;font-size:15px;cursor:pointer}
.btn-install:hover{background:var(--accent2)}
.btn-outline{padding:12px 24px;border:1px solid var(--border);border-radius:24px;font-weight:500;font-size:14px;cursor:pointer}
.btn-outline:hover{background:var(--bg2)}
.btn-icon-sm{width:40px;height:40px;border-radius:50%;border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:18px;cursor:pointer}
.btn-icon-sm:hover{background:var(--bg2)}

/* СКРИНШОТЫ */
.screenshots-row{display:flex;gap:12px;overflow-x:auto;padding:16px 0;scrollbar-width:none}
.screenshots-row::-webkit-scrollbar{display:none}
.screenshot-item{flex:0 0 140px;height:250px;border-radius:12px;background:var(--bg2);overflow:hidden;cursor:pointer}
.screenshot-item img{width:100%;height:100%;object-fit:cover}

/* ОПИСАНИЕ */
.app-description{padding:24px 32px;border-top:1px solid var(--border)}
.app-description h3{font-size:18px;font-weight:600;margin-bottom:12px}
.app-description p{color:var(--text2);line-height:1.6;font-size:14px;margin-bottom:12px}

/* МОДАЛКИ */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:1000;display:none;align-items:center;justify-content:center;padding:20px;backdrop-filter:blur(4px)}
.modal-overlay.active{display:flex}
.modal{background:var(--bg2);border-radius:28px;max-width:520px;width:100%;max-height:90vh;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,.5)}
.modal-lg{max-width:900px}
.modal-head{padding:20px 24px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--border)}
.modal-head h2{font-size:20px;font-weight:600}
.modal-close{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:20px;color:var(--text2);cursor:pointer}
.modal-close:hover{background:var(--bg3)}
.modal-body{padding:24px}
.modal-foot{padding:16px 24px;display:flex;gap:8px;justify-content:flex-end;border-top:1px solid var(--border)}

/* ФОРМЫ */
.form-group{margin-bottom:20px}
.form-group label{display:block;font-size:13px;font-weight:500;color:var(--text2);margin-bottom:8px}
.form-control{width:100%;padding:12px 16px;border-radius:8px;border:1px solid var(--border);background:var(--bg);color:var(--text);font-size:14px;outline:none}
.form-control:focus{border-color:var(--accent)}
textarea.form-control{min-height:100px;resize:vertical}
input[type="file"]{padding:10px;border:1px dashed var(--border);border-radius:8px;background:var(--bg);cursor:pointer;font-size:13px;width:100%}

/* КНОПКИ */
.btn{padding:10px 24px;border-radius:20px;font-weight:600;font-size:14px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:all .2s}
.btn-primary{background:var(--accent);color:#1e1f20}
.btn-primary:hover{background:var(--accent2)}
.btn-danger{background:var(--danger);color:#1e1f20}
.btn-outline{border:1px solid var(--border);color:var(--text)}
.btn-outline:hover{background:var(--bg3)}
.btn-text{color:var(--accent);padding:8px 16px}
.btn-sm{padding:6px 16px;font-size:13px;border-radius:16px}
.btn-full{width:100%}

/* ЧАТ */
.chat-container{max-width:800px;margin:0 auto}
.chat-header{background:var(--bg2);border:1px solid var(--border);border-radius:12px;padding:16px;margin-bottom:16px}
.chat-header h3{font-size:16px;font-weight:600;margin-bottom:6px}
.chat-messages{background:var(--bg);border:1px solid var(--border);border-radius:12px;padding:16px;min-height:400px;max-height:500px;overflow-y:auto;display:flex;flex-direction:column;gap:8px}
.msg{max-width:75%;padding:10px 16px;border-radius:18px;font-size:14px;line-height:1.4}
.msg.me{align-self:flex-end;background:var(--accent);color:#1e1f20;border-bottom-right-radius:4px}
.msg.other{align-self:flex-start;background:var(--bg2);border:1px solid var(--border);border-bottom-left-radius:4px}
.msg-time{font-size:10px;opacity:.7;margin-top:4px;display:block}
.chat-input-row{display:flex;gap:8px;margin-top:12px}
.chat-input-row input{flex:1;padding:12px 16px;border-radius:24px;border:1px solid var(--border);background:var(--bg);color:var(--text);font-size:14px}
.chat-input-row input:focus{outline:none;border-color:var(--accent)}

/* ПРОФИЛЬ */
.profile-layout{display:grid;grid-template-columns:300px 1fr;gap:24px;padding:24px 0}
.profile-card{background:var(--bg2);border:1px solid var(--border);border-radius:16px;padding:24px;text-align:center}
.profile-avatar{width:80px;height:80px;border-radius:50%;background:var(--accent);color:#1e1f20;display:flex;align-items:center;justify-content:center;font-size:32px;font-weight:700;margin:0 auto 16px}
.profile-card h3{font-size:18px;font-weight:600;margin-bottom:8px}
.profile-card .role{font-size:12px;color:var(--text2);margin-bottom:16px}
.profile-menu{display:flex;flex-direction:column;gap:4px}
.profile-menu-item{padding:12px 16px;border-radius:8px;text-align:left;font-size:14px;color:var(--text);display:flex;align-items:center;gap:12px;cursor:pointer}
.profile-menu-item:hover{background:var(--bg3)}
.profile-menu-item.active{background:rgba(129,201,149,.15);color:var(--accent);font-weight:500}

/* НАСТРОЙКИ */
.settings-list{background:var(--bg2);border:1px solid var(--border);border-radius:12px;overflow:hidden}
.settings-item{padding:16px;display:flex;align-items:center;gap:16px;border-bottom:1px solid var(--border);cursor:pointer}
.settings-item:last-child{border-bottom:none}
.settings-item:hover{background:var(--bg3)}
.settings-item .si-icon{font-size:20px;width:24px;text-align:center}
.settings-item .si-info{flex:1}
.settings-item .si-info strong{display:block;font-size:14px;font-weight:500;margin-bottom:2px}
.settings-item .si-info span{font-size:12px;color:var(--text2)}
.toggle{position:relative;width:40px;height:22px;background:var(--bg3);border-radius:11px;cursor:pointer;transition:.2s;flex-shrink:0}
.toggle.on{background:var(--accent)}
.toggle::after{content:"";position:absolute;top:2px;left:2px;width:18px;height:18px;background:#fff;border-radius:50%;transition:.2s}
.toggle.on::after{left:20px}

/* КАРТОЧКИ СТАТИСТИКИ */
.stats-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px;margin-bottom:24px}
.stat-card{background:var(--bg2);border:1px solid var(--border);border-radius:12px;padding:16px}
.stat-card .stat-label{font-size:12px;color:var(--text2);margin-bottom:4px}
.stat-card .stat-value{font-size:24px;font-weight:700}

/* КАРТОЧКА ЗАЯВКИ */
.order-card{background:var(--bg2);border:1px solid var(--border);border-radius:12px;padding:16px;margin-bottom:12px;display:grid;grid-template-columns:56px 1fr auto;gap:16px;align-items:center}
.order-icon{width:56px;height:56px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:28px;overflow:hidden}
.order-icon img{width:100%;height:100%;object-fit:cover}
.order-info h4{font-size:14px;font-weight:600;margin-bottom:4px}
.order-info p{font-size:12px;color:var(--text2);margin-bottom:2px}
.order-actions{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}

/* ПУСТОЕ СОСТОЯНИЕ */
.empty{text-align:center;padding:60px 20px;color:var(--text2)}
.empty-icon{font-size:64px;margin-bottom:16px;opacity:.4}
.empty h3{font-size:18px;font-weight:600;color:var(--text);margin-bottom:8px}

/* ЗАГРУЗКА */
.loading-spinner{display:flex;align-items:center;justify-content:center;padding:60px;color:var(--text2)}
.spinner{width:40px;height:40px;border:3px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* ТОСТЫ */
.toasts{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);z-index:2000;display:flex;flex-direction:column;gap:8px;pointer-events:none}
.toast{background:#323232;color:#fff;border-radius:8px;padding:12px 20px;display:flex;align-items:center;gap:10px;min-width:280px;box-shadow:0 4px 12px rgba(0,0,0,.3);animation:slideUp .3s;pointer-events:auto;font-size:14px}
@keyframes slideUp{from{transform:translateY(20px);opacity:0}to{transform:translateY(0);opacity:1}}
.toast-icon{font-size:18px}
.toast.success .toast-icon{color:#81c995}
.toast.error .toast-icon{color:#f28b82}
.toast.info .toast-icon{color:#8ab4f8}

/* ПРЕВЬЮ СКРИНШОТОВ */
.screenshots-preview{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:10px;margin-top:10px}
.screenshot-thumb{position:relative;aspect-ratio:9/16;border-radius:8px;overflow:hidden;background:var(--bg);border:1px solid var(--border)}
.screenshot-thumb img{width:100%;height:100%;object-fit:cover}
.screenshot-thumb .remove{position:absolute;top:4px;right:4px;width:24px;height:24px;border-radius:50%;background:rgba(0,0,0,.7);color:#fff;display:flex;align-items:center;justify-content:center;font-size:14px;cursor:pointer}

/* РАДИО */
.radio-group{display:grid;gap:8px}
.radio-item{display:flex;align-items:center;gap:12px;padding:14px;border:1px solid var(--border);border-radius:8px;cursor:pointer}
.radio-item:hover{background:var(--bg3)}
.radio-item.selected{border-color:var(--accent);background:rgba(129,201,149,.1)}
.radio-dot{width:20px;height:20px;border-radius:50%;border:2px solid var(--text2);position:relative;flex-shrink:0}
.radio-item.selected .radio-dot{border-color:var(--accent)}
.radio-item.selected .radio-dot::after{content:"";position:absolute;inset:3px;background:var(--accent);border-radius:50%}

/* МОБИЛЬНАЯ НАВИГАЦИЯ */
.mobile-nav{display:none;position:fixed;bottom:0;left:0;right:0;background:var(--bg2);border-top:1px solid var(--border);padding:8px 0;z-index:100}
.mobile-nav-inner{display:flex;justify-content:space-around}
.mobile-nav-btn{display:flex;flex-direction:column;align-items:center;gap:4px;padding:6px 12px;color:var(--text2);font-size:10px}
.mobile-nav-btn.active{color:var(--accent)}
.mobile-nav-btn .ico{font-size:20px}

/* АДАПТИВ */
@media(max-width:1024px){
  .sidebar{transform:translateX(-100%);transition:transform .3s}
  .sidebar.open{transform:translateX(0)}
  .main{margin-left:0}
  .mobile-nav{display:block}
  .content{padding-bottom:80px}
  .hero-banner{flex-direction:column;text-align:center;padding:32px}
  .hero-emoji{font-size:80px}
  .profile-layout{grid-template-columns:1fr}
  .app-page-header{flex-direction:column;align-items:center;text-align:center}
}
@media(max-width:720px){
  .topbar{padding:12px 16px}
  .content{padding:16px 16px 80px}
  .page-tabs{padding:12px 16px}
  .app-card-h{flex:0 0 130px}
  .app-card-h .app-icon{width:130px;height:130px;border-radius:24px;font-size:56px}
  .hero-text h1{font-size:24px}
  .app-page-icon{width:120px;height:120px;border-radius:24px;font-size:60px}
}

/* СКРОЛЛБАР */
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-track{background:var(--bg)}
::-webkit-scrollbar-thumb{background:var(--bg3);border-radius:4px}
::-webkit-scrollbar-thumb:hover{background:var(--text2)}
</style>
</head>
<body>

<!-- БОКОВОЕ МЕНЮ -->
<aside class="sidebar" id="sidebar">
  <div class="sidebar-logo">
    <div class="logo-icon">a</div>
    <span>awer</span>
  </div>
  <nav class="sidebar-nav" id="sidebarNav">
    <div class="sidebar-item active" data-page="home" onclick="nav('home')">
      <span class="si-icon">🏠</span><span>Главная</span>
    </div>
    <div class="sidebar-item" data-page="catalog" onclick="nav('catalog')">
      <span class="si-icon">🔍</span><span>Каталог</span>
    </div>
    <div class="sidebar-item" data-page="games" onclick="nav('catalog',{cat:'games'})">

const maintenanceRef = db.collection('siteSettings').doc('maintenance');
function checkMaintenance() {
  maintenanceRef.onSnapshot(function(doc) {
    const old = document.getElementById('maintenanceOverlay');
    if (old) { if (old._cleanup) old._cleanup(); old.remove(); }
    if (!doc.exists) return;
    const data = doc.data();
    if (!data.enabled) return;
    if (S.cu && (S.cu.role === 'admin' || S.cu.role === 'developer')) return;
    const endTime = data.endTime ? data.endTime.toMillis() : null;
    const message = data.message || 'Сайт временно закрыт.';
    const overlay = document.createElement('div');
    overlay.id = 'maintenanceOverlay';
    overlay.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,.9);z-index:9998;display:flex;align-items:center;justify-content:center;padding:20px;backdrop-filter:blur(10px)';
    const modal = document.createElement('div');
    modal.style.cssText = 'background:#2d2e30;border-radius:24px;max-width:500px;width:100%;padding:40px;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.5)';
    modal.innerHTML = '<div style="font-size:80px;margin-bottom:20px">🛠️</div><h1 style="font-size:28px;font-weight:700;color:#81c995;margin-bottom:16px">Сайт временно закрыт</h1><p style="font-size:16px;color:#9aa0a6;line-height:1.6;margin-bottom:30px">' + message + '</p><div id="maintenanceTimer" style="display:flex;justify-content:center;gap:12px;margin-bottom:20px"></div>';
    overlay.appendChild(modal);
    document.body.appendChild(overlay);
    function updateTimer() {
      const timerEl = document.getElementById('maintenanceTimer');
      if (!timerEl) return;
      if (!endTime) { timerEl.innerHTML = '<p style="font-size:18px;color:#81c995;font-weight:600">Скоро откроемся!</p>'; return; }
      const diff = endTime - Date.now();
      if (diff <= 0) { timerEl.innerHTML = '<p style="font-size:18px;color:#81c995;font-weight:600">Открываемся! 🎉</p>'; maintenanceRef.update({ enabled: false }).catch(() => {}); return; }
      const d = Math.floor(diff / 86400000), h = Math.floor((diff % 86400000) / 3600000), m = Math.floor((diff % 3600000) / 60000), s = Math.floor((diff % 60000) / 1000);
      const tb = (v, l) => '<div style="background:#3c4043;border-radius:12px;padding:12px 16px;min-width:70px"><div style="font-size:28px;font-weight:700;color:#81c995">' + String(v).padStart(2,'0') + '</div><div style="font-size:11px;color:#9aa0a6;margin-top:4px">' + l + '</div></div>';
      timerEl.innerHTML = (d > 0 ? tb(d,'дней') : '') + tb(h,'часов') + tb(m,'минут') + tb(s,'секунд');
    }
    updateTimer();
    const ti = setInterval(updateTimer, 1000);
    overlay._cleanup = () => clearInterval(ti);
  });
}

function registerWithNick(nick, role) {
  return new Promise((resolve, reject) => {
    if (nick === 'awer_studio') {
      resolve({ uid: 'official_awer_studio', nick: 'awer_studio', name: 'awer_studio', role: 'developer', avatar: '🏆', verified: true, official: true, blocked: false });
      return;
    }
    db.collection('users').where('nick', '==', nick).limit(1).get().then(snap => {
      if (!snap.empty) { reject(new Error('Ник занят.')); return; }
      const uid = 'user_' + Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
      db.collection('users').doc(uid).set({ nick, name: nick, role: role || 'buyer', avatar: nick[0], verified: false, official: false, blocked: false, createdAt: firebase.firestore.FieldValue.serverTimestamp() })
        .then(() => resolve({ uid, nick, name: nick, role: role || 'buyer', avatar: nick[0], verified: false, official: false, blocked: false }))
        .catch(err => reject(new Error(err.message)));
    }).catch(err => reject(new Error('Ошибка')));
  });
}

function loginWithNick(nick) {
  return new Promise((resolve, reject) => {
    if (nick === 'awer_studio') {
      resolve({ uid: 'official_awer_studio', nick: 'awer_studio', name: 'awer_studio', role: 'developer', avatar: '🏆', verified: true, official: true, blocked: false });
      return;
    }
    db.collection('users').where('nick', '==', nick).limit(1).get().then(snap => {
      if (snap.empty) { reject(new Error('Не найден.')); return; }
      const doc = snap.docs[0]; const data = doc.data();
      if (data.blocked) { reject(new Error('Заблокирован.')); return; }
      resolve({ uid: doc.id, nick, name: data.name || nick, role: data.role || 'buyer', avatar: data.avatar || nick[0], verified: data.verified || false, official: false, blocked: data.blocked || false });
    }).catch(err => reject(new Error('Ошибка')));
  });
}

function openScreenshotViewer(screenshots,currentSh) {
  let idx=-1;
  for (let i=0;i<screenshots.length;i++) { if (screenshots[i].url===currentSh.url) { idx=i; break; } }
  if (idx<0) idx=0;
  const m = el('div',{});
  m.append(el('div',{class:'modal-head'},el('h2',{},'Скриншот '+(idx+1)+' из '+screenshots.length),el('div',{class:'modal-close',onclick:closeM},'✕')));
  const body = el('div',{class:'modal-body'});
  const imgWrap = el('div',{style:'text-align:center;min-height:400px;display:flex;align-items:center;justify-content:center;background:var(--bg);border-radius:12px;overflow:hidden'});
  body.append(imgWrap);
  const nav = el('div',{style:'display:flex;gap:8px;justify-content:center;margin-top:12px'});
  const prevBtn = el('button',{class:'btn btn-outline btn-sm'});prevBtn.textContent='← Назад';prevBtn.addEventListener('click',()=>{idx=(idx-1+screenshots.length)%screenshots.length;show()});nav.append(prevBtn);
  const nextBtn = el('button',{class:'btn btn-outline btn-sm'});nextBtn.textContent='Далее →';nextBtn.addEventListener('click',()=>{idx=(idx+1)%screenshots.length;show()});nav.append(nextBtn);
  body.append(nav);
  function show() { const sh=screenshots[idx];imgWrap.innerHTML='';imgWrap.append(el('img',{src:sh.url,style:'max-width:100%;max-height:600px'}));const h2=$('h2',m);if(h2)h2.textContent='Скриншот '+(idx+1)+' из '+screenshots.length; }
  show();
  m.append(body); openM(m,true);
}

function compressImage(file,maxW){
  maxW=maxW||800;
  return new Promise((res,rej)=>{
    const r=new FileReader();
    r.onload=function(e){const img=new Image();img.onload=function(){let w=img.width,h=img.height;if(w>maxW){h=Math.round(h*maxW/w);w=maxW}const c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(img,0,0,w,h);c.toBlob(b=>{if(!b)rej(new Error('Ошибка'));else res({blob:b,width:w,height:h})},'image/jpeg',0.85)};img.onerror=()=>rej(new Error('Не изображение'));img.src=e.target.result};
    r.onerror=()=>rej(new Error('Ошибка'));r.readAsDataURL(file);
  });
}
function uploadToImgBB(file){
  return new Promise((res,rej)=>{
    const fd=new FormData();fd.append('image',file);fd.append('key',IMGBB_KEY);
    fetch('https://api.imgbb.com/1/upload',{method:'POST',body:fd}).then(r=>r.json()).then(d=>{if(d.success)res(d.data.url);else rej(new Error(d.error?d.error.message:'Ошибка'))}).catch(rej);
  });
}
