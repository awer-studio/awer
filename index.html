<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>awer</title>
<script>
(function(){
  var t = localStorage.getItem('awer_theme') || 'light';
  document.documentElement.setAttribute('data-theme', t);
  if (t === 'dark') {
    document.documentElement.style.cssText = 'background:#202124;color:#e8eaed';
  }
})();
</script>
<style>
:root{--bg:#fff;--bg2:#f8f9fa;--text:#202124;--text2:#5f6368;--border:#dadce0;--accent:#01875f;--accent2:#1e8e3e;--danger:#d93025;--chip:#e8eaed}
[data-theme="dark"]{--bg:#202124;--bg2:#2d2e30;--text:#e8eaed;--text2:#9aa0a6;--border:#3c4043;--accent:#81c995;--accent2:#81c995;--chip:#3c4043}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--text);font-family:'Segoe UI',sans-serif;min-height:100vh;font-size:14px}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,textarea,select{font-family:inherit}
.container{max-width:1200px;margin:0 auto;padding:0 20px}
.header{position:sticky;top:0;z-index:50;background:var(--bg);border-bottom:1px solid var(--border);padding:12px 20px;display:flex;align-items:center;gap:16px}
.logo{font-size:22px;font-weight:700;color:var(--accent);cursor:pointer;display:flex;align-items:center;gap:8px}
.logo-mark{width:30px;height:30px;border-radius:8px;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:16px}
.search{flex:1;max-width:600px}
.search input{width:100%;padding:10px 16px;border-radius:24px;border:1px solid var(--border);background:var(--bg2);color:var(--text);font-size:14px}
.search input:focus{outline:none;border-color:var(--accent)}
.header-actions{display:flex;align-items:center;gap:8px}
.icon-btn{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:18px;cursor:pointer}
.icon-btn:hover{background:var(--bg2)}
.avatar-btn{width:32px;height:32px;border-radius:50%;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;font-size:13px;cursor:pointer}
.hero{background:linear-gradient(135deg,#e8f5e9,#c8e6c9);padding:50px 30px;border-radius:16px;margin:24px 0;text-align:center}
[data-theme="dark"] .hero{background:linear-gradient(135deg,#1b3a2a,#2d5a3d)}
.hero h1{font-size:32px;margin-bottom:12px}
.hero p{color:var(--text2);margin-bottom:20px}
.hero .tag{display:inline-block;padding:4px 12px;background:rgba(1,135,95,.15);color:var(--accent);border-radius:12px;font-size:12px;font-weight:500;margin-bottom:12px}
.section{margin:32px 0}
.section-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.section-head h2{font-size:20px;font-weight:500}
.section-head .more{color:var(--accent);font-size:14px;cursor:pointer}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:8px}
.chips::-webkit-scrollbar{display:none}
.chip{padding:8px 16px;border-radius:8px;background:var(--bg2);font-size:13px;cursor:pointer;white-space:nowrap;border:1px solid transparent}
.chip:hover{background:var(--chip)}
.chip.active{background:rgba(1,135,95,.15);color:var(--accent);border-color:var(--accent)}
.carousel{display:flex;gap:16px;overflow-x:auto;padding-bottom:8px}
.carousel::-webkit-scrollbar{display:none}
.app-item{flex:0 0 130px;cursor:pointer;text-align:center}
.app-ico{width:130px;height:130px;border-radius:24px;display:flex;align-items:center;justify-content:center;font-size:56px;margin-bottom:8px;overflow:hidden;box-shadow:0 1px 3px rgba(0,0,0,.1)}
.app-ico img{width:100%;height:100%;object-fit:cover}
.app-name{font-size:14px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.app-dev{font-size:12px;color:var(--text2);display:flex;align-items:center;gap:4px;justify-content:center}
.app-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:16px}
.btn{padding:10px 20px;border-radius:20px;font-weight:500;font-size:14px;border:1px solid transparent;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.btn-primary{background:var(--accent);color:#fff}
.btn-primary:hover{background:var(--accent2)}
.btn-outline{border-color:var(--accent);color:var(--accent)}
.btn-outline:hover{background:rgba(1,135,95,.08)}
.btn-sm{padding:6px 14px;font-size:13px;border-radius:16px}
.btn-danger{background:var(--danger);color:#fff}
.btn-text{color:var(--accent);padding:8px 12px}
.btn-text:hover{background:rgba(1,135,95,.08)}
.btn-icon{width:36px;height:36px;padding:0;border-radius:50%;justify-content:center}
.back-btn{color:var(--accent);cursor:pointer;margin:16px 0;font-size:14px;display:inline-flex;align-items:center;gap:4px}
.back-btn:hover{text-decoration:underline}
.app-page{padding:24px 0}
.app-top{display:grid;grid-template-columns:auto 1fr;gap:24px;align-items:start;margin-bottom:24px}
.app-icon{width:160px;height:160px;border-radius:32px;display:flex;align-items:center;justify-content:center;font-size:80px;overflow:hidden;box-shadow:0 1px 3px rgba(0,0,0,.1)}
.app-icon img{width:100%;height:100%;object-fit:cover}
.app-info h1{font-size:24px;margin-bottom:8px}
.app-info .dev{color:var(--accent);font-size:14px;margin-bottom:12px;display:flex;align-items:center;gap:4px}
.official{color:#ffd700;font-weight:700;font-size:16px}
.verified{color:var(--accent);font-size:14px}
.meta{display:flex;gap:20px;padding:12px 0;border-bottom:1px solid var(--border);margin-bottom:16px;flex-wrap:wrap}
.meta-item{text-align:center}
.meta-item .val{font-weight:500;font-size:15px}
.meta-item .lbl{font-size:12px;color:var(--text2)}
.status-badge{display:inline-flex;padding:4px 10px;border-radius:12px;font-size:12px;font-weight:500}
.status-verified{background:rgba(30,142,62,.1);color:var(--accent2)}
.status-pending{background:rgba(249,171,0,.1);color:#b06000}
.status-blocked{background:rgba(217,48,37,.1);color:var(--danger)}
.about{padding:16px 0;border-bottom:1px solid var(--border)}
.about h3{margin-bottom:8px;font-size:16px}
.about p{color:var(--text2);line-height:1.6}
.features-list{list-style:none;margin-top:8px}
.features-list li{padding-left:20px;position:relative;color:var(--text2);margin-bottom:4px}
.features-list li::before{content:"✓";position:absolute;left:0;color:var(--accent);font-weight:700}
.screenshots{display:flex;gap:12px;overflow-x:auto;padding:8px 0}
.screenshots::-webkit-scrollbar{display:none}
.screenshot{flex:0 0 160px;height:280px;border-radius:12px;background:var(--bg2);border:1px solid var(--border);overflow:hidden;cursor:pointer}
.screenshot img{width:100%;height:100%;object-fit:cover}
.review{padding:14px 0;border-bottom:1px solid var(--border)}
.review-head{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.review-avatar{width:32px;height:32px;border-radius:50%;background:var(--chip);display:flex;align-items:center;justify-content:center;font-weight:500;font-size:13px}
.review-author{font-weight:500;font-size:14px}
.review-date{font-size:12px;color:var(--text2)}
.review-text{color:var(--text);line-height:1.5;margin-top:4px}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:100;display:none;align-items:center;justify-content:center;padding:20px}
.modal-bg.active{display:flex}
.modal{background:var(--bg);border-radius:20px;max-width:500px;width:100%;max-height:90vh;overflow-y:auto;padding:24px}
.modal-lg{max-width:900px}
.modal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.modal-head h2{font-size:20px;font-weight:500}
.modal-close{font-size:24px;cursor:pointer;width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center}
.modal-close:hover{background:var(--bg2)}
.modal-foot{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}
.form-group{margin-bottom:14px}
.form-group label{display:block;font-size:12px;color:var(--text2);margin-bottom:4px;font-weight:500}
.form-control{width:100%;padding:10px 12px;border:1px solid var(--border);border-radius:8px;background:var(--bg2);color:var(--text);font-size:14px}
.form-control:focus{outline:none;border-color:var(--accent)}
textarea.form-control{min-height:80px;resize:vertical}
.radio-group{display:grid;gap:8px}
.radio-item{padding:12px;border:1px solid var(--border);border-radius:8px;cursor:pointer;display:flex;align-items:center;gap:10px}
.radio-item:hover{background:var(--bg2)}
.radio-item.selected{border-color:var(--accent);background:rgba(1,135,95,.05)}
.radio-dot{width:18px;height:18px;border-radius:50%;border:2px solid var(--text2);position:relative;flex-shrink:0}
.radio-item.selected .radio-dot{border-color:var(--accent)}
.radio-item.selected .radio-dot::after{content:"";position:absolute;inset:3px;background:var(--accent);border-radius:50%}
.radio-label strong{display:block;font-size:14px;font-weight:500}
.order-card{background:var(--bg);border:1px solid var(--border);border-radius:12px;padding:14px;margin-bottom:10px;display:flex;align-items:center;gap:14px}
.order-ico{width:48px;height:48px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:24px;overflow:hidden;flex-shrink:0}
.order-ico img{width:100%;height:100%;object-fit:cover}
.order-info{flex:1}
.order-info h4{font-size:14px;font-weight:500;margin-bottom:4px}
.order-info p{font-size:12px;color:var(--text2);margin-bottom:2px}
.order-actions{display:flex;gap:6px;flex-wrap:wrap}
.chat-wrap{max-width:800px}
.chat-head{background:var(--bg);border:1px solid var(--border);border-radius:12px;padding:14px;margin-bottom:12px}
.chat-head h3{font-size:16px;margin-bottom:6px}
.chat-warning{background:rgba(249,171,0,.08);border:1px solid rgba(249,171,0,.3);border-radius:8px;padding:10px;font-size:12px;color:#b06000;margin:10px 0}
.chat-box{background:var(--bg2);border:1px solid var(--border);border-radius:12px;padding:14px;min-height:300px;max-height:400px;overflow-y:auto;display:flex;flex-direction:column;gap:8px}
.msg{max-width:75%;padding:8px 12px;border-radius:14px;font-size:14px;line-height:1.4}
.msg.me{margin-left:auto;background:var(--accent);color:#fff;border-bottom-right-radius:4px}
.msg.other{background:var(--bg);border:1px solid var(--border);border-bottom-left-radius:4px}
.msg-time{font-size:10px;opacity:.7;display:block;margin-top:2px}
.msg-author{font-size:11px;font-weight:500;margin-bottom:2px;opacity:.8}
.chat-input{display:flex;gap:8px;margin-top:10px}
.chat-input input{flex:1;padding:10px 14px;border-radius:20px;border:1px solid var(--border);background:var(--bg2);color:var(--text);font-size:14px}
.chat-input input:focus{outline:none;border-color:var(--accent)}
.profile-grid{display:grid;grid-template-columns:240px 1fr;gap:20px;padding:20px 0}
.profile-card{background:var(--bg);border:1px solid var(--border);border-radius:12px;padding:20px;text-align:center;height:fit-content}
.profile-avatar{width:72px;height:72px;border-radius:50%;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;font-size:28px;margin:0 auto 10px}
.profile-card h3{font-size:18px;font-weight:500;margin-bottom:4px}
.profile-card p{font-size:13px;color:var(--text2);margin-bottom:10px}
.profile-menu{display:grid;gap:4px;margin-top:14px}
.profile-menu button{padding:10px 14px;border-radius:8px;text-align:left;font-size:14px;display:flex;align-items:center;gap:10px}
.profile-menu button:hover{background:var(--bg2)}
.profile-menu button.active{background:rgba(1,135,95,.1);color:var(--accent);font-weight:500}
.settings-list{background:var(--bg);border:1px solid var(--border);border-radius:12px;overflow:hidden}
.settings-item{padding:14px 16px;display:flex;align-items:center;gap:14px;border-bottom:1px solid var(--border);cursor:pointer}
.settings-item:last-child{border-bottom:none}
.settings-item:hover{background:var(--bg2)}
.settings-ico{font-size:20px;width:28px;text-align:center}
.settings-info{flex:1}
.settings-info strong{display:block;font-size:14px;font-weight:500}
.settings-info span{font-size:12px;color:var(--text2)}
.toggle{position:relative;width:36px;height:20px;background:var(--chip);border-radius:10px;cursor:pointer;flex-shrink:0}
.toggle.on{background:var(--accent)}
.toggle::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;background:#fff;border-radius:50%;transition:.2s}
.toggle.on::after{left:18px}
.stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px;margin-bottom:16px}
.stat{background:var(--bg);border:1px solid var(--border);border-radius:10px;padding:14px}
.stat .lbl{font-size:12px;color:var(--text2);margin-bottom:4px}
.stat .val{font-size:22px;font-weight:600}
.toast-box{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);z-index:200;display:flex;flex-direction:column;gap:6px;pointer-events:none}
.toast{background:#323232;color:#fff;padding:10px 18px;border-radius:8px;font-size:14px;min-width:250px;pointer-events:auto;animation:slideUp .3s}
@keyframes slideUp{from{transform:translateY(20px);opacity:0}to{transform:translateY(0);opacity:1}}
.empty{text-align:center;padding:50px;color:var(--text2)}
.empty .ico{font-size:50px;margin-bottom:10px;opacity:.4}
.empty h3{font-size:18px;font-weight:500;color:var(--text);margin-bottom:6px}
.spinner{width:36px;height:36px;border:3px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin 1s linear infinite;margin:40px auto}
@keyframes spin{to{transform:rotate(360deg)}}
.footer{background:var(--bg2);border-top:1px solid var(--border);padding:24px 0 14px;margin-top:40px}
.footer-grid{display:grid;grid-template-columns:2fr 1fr 1fr 1fr;gap:24px;margin-bottom:20px}
.footer h4{font-size:13px;font-weight:500;margin-bottom:10px}
.footer ul{list-style:none}
.footer ul li{font-size:13px;color:var(--text2);cursor:pointer;margin-bottom:6px}
.footer ul li:hover{color:var(--text)}
.footer-bottom{padding-top:14px;border-top:1px solid var(--border);text-align:center;font-size:12px;color:var(--text2)}
.footer-warning{background:rgba(249,171,0,.08);border:1px solid rgba(249,171,0,.3);border-radius:8px;padding:10px;font-size:12px;color:#b06000;margin-bottom:16px}
.mobile-nav{display:none;position:fixed;bottom:0;left:0;right:0;background:var(--bg);border-top:1px solid var(--border);padding:6px 0;z-index:40}
.mobile-nav-inner{display:flex;justify-content:space-around}
.mobile-nav-btn{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 10px;color:var(--text2);font-size:10px}
.mobile-nav-btn.active{color:var(--accent)}
.mobile-nav-btn .ico{font-size:18px}
.welcome-overlay{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:9999;display:flex;align-items:center;justify-content:center;padding:20px}
.welcome-modal{background:var(--bg);border-radius:24px;max-width:500px;width:100%;padding:30px;text-align:center}
.welcome-modal h1{font-size:28px;color:var(--accent);margin-bottom:12px}
.welcome-modal .subtitle{font-size:16px;margin-bottom:16px}
.welcome-modal .description{font-size:14px;color:var(--text2);line-height:1.6;margin-bottom:20px}
.welcome-btn{background:var(--accent);color:#fff;border:none;padding:14px 32px;border-radius:24px;font-size:16px;font-weight:600;cursor:pointer}
.progress-bar{height:6px;background:var(--chip);border-radius:3px;overflow:hidden;margin-top:8px}
.progress-fill{height:100%;background:var(--accent);transition:width .2s}
.ss-preview{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:8px;margin-top:8px}
.ss-thumb{position:relative;aspect-ratio:9/16;border-radius:8px;overflow:hidden;background:var(--bg2);border:1px solid var(--border)}
.ss-thumb img{width:100%;height:100%;object-fit:cover}
.ss-thumb .rm{position:absolute;top:4px;right:4px;width:22px;height:22px;border-radius:50%;background:rgba(0,0,0,.6);color:#fff;display:flex;align-items:center;justify-content:center;font-size:12px;cursor:pointer}
.file-input{width:100%;padding:10px;border:1px dashed var(--border);border-radius:8px;background:var(--bg2);cursor:pointer;font-size:13px}
@media(max-width:700px){
  .profile-grid{grid-template-columns:1fr}
  .app-top{grid-template-columns:auto 1fr;gap:14px}
  .app-icon{width:100px;height:100px;font-size:50px;border-radius:20px}
  .hero h1{font-size:24px}
  .footer-grid{grid-template-columns:1fr 1fr}
  .mobile-nav{display:block}
  body{padding-bottom:70px}
  .container{padding:0 14px}
}
</style>
</head>

  var e = document.createElement(tag);
  if (attrs) {

      else if (k === 'style') e.style.cssText = attrs[k];

function getOfficialUser() {
  return { uid: 'official', nick: OFFICIAL_NICK, name: OFFICIAL_NICK, role: 'developer', avatar: '', verified: true, official: true, blocked: false };

function registerWithNick(nick, role) {
  return new Promise(function(resolve, reject) {
    if (nick === OFFICIAL_NICK) { resolve(getOfficialUser()); return; }
    db.collection('users').where('nick', '==', nick).limit(1).get().then(function(snap) {
      if (!snap.empty) { reject(new Error('Ник занят')); return; }
      var uid = 'u' + Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
      db.collection('users').doc(uid).set({
        nick: nick, name: nick, role: role || 'buyer',
        avatar: nick[0], verified: false, official: false, blocked: false,
        createdAt: firebase.firestore.FieldValue.serverTimestamp()
      }).then(function() {
        resolve({ uid: uid, nick: nick, name: nick, role: role || 'buyer', avatar: nick[0], verified: false, official: false, blocked: false });
      }).catch(function(err) { reject(new Error(err.message)); });
    }).catch(function() { reject(new Error('Ошибка')); });
  });
}

function loginWithNick(nick) {
  return new Promise(function(resolve, reject) {
    if (nick === OFFICIAL_NICK) { resolve(getOfficialUser()); return; }
    db.collection('users').where('nick', '==', nick).limit(1).get().then(function(snap) {
      if (snap.empty) { reject(new Error('Не найден')); return; }
      var doc = snap.docs[0];
      var data = doc.data();
      if (data.blocked) { reject(new Error('Заблокирован')); return; }
      resolve({ uid: doc.id, nick: nick, name: data.name || nick, role: data.role || 'buyer', avatar: data.avatar || nick[0], verified: data.verified || false, official: false, blocked: data.blocked || false });
    }).catch(function() { reject(new Error('Ошибка')); });
  });
}

function compressImage(file, maxW) {
  maxW = maxW || 800;
  return new Promise(function(res, rej) {
    var r = new FileReader();
    r.onload = function(e) {
      var img = new Image();
      img.onload = function() {
        var w = img.width, h = img.height;
        if (w > maxW) { h = Math.round(h * maxW / w); w = maxW; }
        var c = document.createElement('canvas');
        c.width = w; c.height = h;
        c.getContext('2d').drawImage(img, 0, 0, w, h);
        c.toBlob(function(b) { if (!b) rej(new Error('Ошибка')); else res({blob: b, width: w, height: h}); }, 'image/jpeg', 0.85);
      };
      img.onerror = function() { rej(new Error('Не изображение')); };
      img.src = e.target.result;
    };
    r.onerror = function() { rej(new Error('Ошибка')); };
    r.readAsDataURL(file);
  });
}

function uploadToImgBB(file) {
  return new Promise(function(res, rej) {
    var fd = new FormData();
    fd.append('image', file);
    fd.append('key', IMGBB_KEY);
    fetch('https://api.imgbb.com/1/upload', {method: 'POST', body: fd})
      .then(function(r) { return r.json(); })
      .then(function(d) { if (d.success) res(d.data.url); else rej(new Error('Ошибка загрузки')); })
      .catch(rej);
  });
}

  ssWrap.appendChild(ssInput);
  var ssProgress = el('div', {class: 'progress-bar', style: 'display:none'});
  var ssFill = el('div', {class: 'progress-fill', id: 'ssProgFill'});
  ssProgress.appendChild(ssFill);
  var ssText = el('div', {style: 'font-size:11px;color:var(--text2);margin-top:4px', id: 'ssProgText'});
  ssWrap.appendChild(ssProgress);
  ssWrap.appendChild(ssText);
  var ssPreview = el('div', {class: 'ss-preview', id: 'ssPreview'});
  ssWrap.appendChild(ssPreview);
  gs.appendChild(ssWrap);
  f.appendChild(gs);

  var pendingScreenshots = [];

  ssInput.addEventListener('change', function(e) {
    var files = Array.from(e.target.files || []);
    if (files.length === 0) return;
    if (pendingScreenshots.length + files.length > 10) { toast('Максимум 10', '', 'error'); ssInput.value = ''; return; }
    ssProgress.style.display = 'block';
    var processed = 0;
    var total = files.length;
    function processNext() {
      if (processed >= total) {
        ssProgress.style.display = 'none';
        ssInput.value = '';
        renderSSPreview();
        toast('Скриншоты добавлены', total + ' шт.', 'success');
        return;
      }
      var file = files[processed];
      $('#ssProgText').textContent = 'Обработка ' + (processed + 1) + ' из ' + total;
      $('#ssProgFill').style.width = Math.round((processed / total) * 100) + '%';
      compressImage(file, 800).then(function(result) {
        uploadToImgBB(result.blob).then(function(url) {
          pendingScreenshots.push({url: url, name: file.name, size: result.blob.size, width: result.width, height: result.height});
          processed++;
          processNext();
        }).catch(function() { toast('Ошибка загрузки', file.name, 'error'); processed++; processNext(); });
      }).catch(function() { processed++; processNext(); });
    }
    processNext();
  });

  function renderSSPreview() {
    ssPreview.innerHTML = '';
    pendingScreenshots.forEach(function(sh, idx) {
      var thumb = el('div', {class: 'ss-thumb'});
      thumb.appendChild(el('img', {src: sh.url}));
      var rm = el('div', {class: 'rm'});
      rm.textContent = '✕';
      rm.addEventListener('click', function() { pendingScreenshots.splice(idx, 1); renderSSPreview(); });
      thumb.appendChild(rm);
      ssPreview.appendChild(thumb);
    });
  }

  var pubBtn = el('button', {class: 'btn btn-primary', style: 'margin-top:10px'});
  pubBtn.textContent = 'Опубликовать';
  pubBtn.addEventListener('click', function() {
    var name = $('#f_name').value.trim();
    var desc = $('#f_desc').value.trim();
    if (!name) { toast('Введите название', '', 'error'); return; }
    if (!desc) { toast('Введите описание', '', 'error'); return; }
    pubBtn.disabled = true;
    pubBtn.textContent = 'Публикация...';
    var iconFileEl = $('#f_iconFile');
    var iconFile = iconFileEl && iconFileEl.files ? iconFileEl.files[0] : null;
    var iconPromise = Promise.resolve(null);
    if (iconFile) { iconPromise = compressImage(iconFile, 200).then(function(r) { return uploadToImgBB(r.blob); }); }
    iconPromise.then(function(iconUrl) {
      var appData = {
        name: name, desc: desc, cat: $('#f_cat').value,
        price: parseInt($('#f_price').value) || 0,
        ver: $('#f_ver').value.trim() || '1.0.0',
        icon: $('#f_icon').value.trim() || '',
        iconUrl: iconUrl || null,
        fileUrl: $('#f_fileUrl').value.trim(),
        fileName: $('#f_fileName').value.trim(),
        devUid: S.cu.uid, devName: S.cu.name,
        devVerified: S.cu.verified || false,
        official: S.cu.official || false,
        installs: 0, rating: 0, reviews: 0,
        status: 'verified',
        screenshots: pendingScreenshots.slice(),
        createdAt: firebase.firestore.FieldValue.serverTimestamp()
      };
      db.collection('apps').add(appData).then(function() {
        pubBtn.disabled = false;
        pubBtn.textContent = 'Опубликовать';
        pendingScreenshots = [];
        toast('✓ Опубликовано', 'Приложение в каталоге', 'success');
        nav('developer', {tab: 'apps'});
      }).catch(function(e) { pubBtn.disabled = false; pubBtn.textContent = 'Опубликовать'; toast('Ошибка', e.message, 'error'); });
    }).catch(function(e) { pubBtn.disabled = false; pubBtn.textContent = 'Опубликовать'; toast('Ошибка', e.message, 'error'); });
  });
  f.appendChild(pubBtn);
  return f;
}

    msgGroup.appendChild(msgInput);
    formDiv.appendChild(msgGroup);
    var timeGroup = el('div', {class: 'form-group'});
    timeGroup.appendChild(el('label', {}, 'Время открытия'));
    var timeInput = el('input', {class: 'form-control', id: 'maintTime', type: 'datetime-local'});
    timeGroup.appendChild(timeInput);
    formDiv.appendChild(timeGroup);
    var btns = el('div', {style: 'display:flex;gap:12px;flex-wrap:wrap;margin-top:16px'});
    var enableBtn = el('button', {class: 'btn btn-danger'});
    enableBtn.textContent = '🔒 Закрыть сайт';
    enableBtn.addEventListener('click', function() {
      var msg = $('#maintMessage').value.trim();
      var timeVal = $('#maintTime').value;
      if (!timeVal) { toast('Укажите время', '', 'error'); return; }
      if (!msg) { toast('Напишите сообщение', '', 'error'); return; }
      var endTime = new Date(timeVal);
      if (endTime.getTime() < Date.now()) { toast('Время должно быть в будущем', '', 'error'); return; }
      db.collection('siteSettings').doc('maintenance').set({enabled: true, message: msg, endTime: firebase.firestore.Timestamp.fromDate(endTime), updatedAt: firebase.firestore.FieldValue.serverTimestamp(), setBy: S.cu.uid}).then(function() { toast('Сайт закрыт', 'Пользователи увидят таймер', 'success'); }).catch(function(e) { toast('Ошибка', e.message, 'error'); });
    });
    btns.appendChild(enableBtn);
    var disableBtn = el('button', {class: 'btn btn-primary'});
    disableBtn.textContent = '🔓 Открыть сайт';
    disableBtn.addEventListener('click', function() {
      if (!confirm('Открыть сайт?')) return;
      db.collection('siteSettings').doc('maintenance').update({enabled: false}).then(function() { toast('Сайт открыт', '', 'success'); }).catch(function(e) { toast('Ошибка', e.message, 'error'); });
    });
    btns.appendChild(disableBtn);
    formDiv.appendChild(btns);
    siteSection.appendChild(formDiv);
    db.collection('siteSettings').doc('maintenance').onSnapshot(function(doc) {
      if (!doc.exists) { statusDiv.innerHTML = '<div style="color:var(--accent);font-weight:600">✅ Сайт открыт</div>'; return; }
      var data = doc.data();
      if (data.enabled) {
        var endTime = data.endTime ? data.endTime.toDate().toLocaleString('ru-RU') : 'не указано';
        statusDiv.innerHTML = '<div style="color:var(--danger);font-weight:600;margin-bottom:8px">🔒 Сайт ЗАКРЫТ</div><div style="font-size:13px;color:var(--text2)">Сообщение: ' + (data.message || '—') + '</div><div style="font-size:13px;color:var(--text2);margin-top:4px">Откроется: ' + endTime + '</div>';
      } else {
        statusDiv.innerHTML = '<div style="color:var(--accent);font-weight:600">✅ Сайт открыт</div>';
      }
    });
    w.appendChild(siteSection);
  }
  return w;
}

function showAuth() {
  var m = el('div', {});
  var head = el('div', {class: 'modal-head'}, el('h2', {}, 'Войти в awer'), el('button', {class: 'modal-close', onclick: closeModal}, '✕'));
  var body = el('div', {});
  var mode = 'login';

  function rf() {
    body.innerHTML = '';
    if (mode === 'login') {
      body.appendChild(el('div', {class: 'form-group'}, el('label', {}, 'Ник'), el('input', {class: 'form-control', id: 'aNick', placeholder: 'Ваш ник'})));
      var loginBtn = el('button', {class: 'btn btn-primary', style: 'width:100%;margin-bottom:10px'});
      loginBtn.textContent = 'Войти';
      loginBtn.addEventListener('click', function() {
        var nick = $('#aNick').value.trim();
        if (!nick) { toast('Введите ник', '', 'error'); return; }
        loginWithNick(nick).then(function(result) {
          S.cu = result;
          localStorage.setItem('awer_nick', nick);
          saveSettings();
          closeModal();
          render();
          toast('Добро пожаловать!', nick, 'success');
        }).catch(function(err) { toast('Ошибка', err.message, 'error'); });
      });
      body.appendChild(loginBtn);
      body.appendChild(el('p', {style: 'text-align:center;font-size:13px;color:var(--text2);margin-top:10px'}, 'Нет аккаунта? ', el('span', {style: 'color:var(--accent);cursor:pointer;font-weight:500', onclick: function() { mode = 'register'; rf(); }}, 'Зарегистрироваться')));
    } else {
      body.appendChild(el('div', {class: 'form-group'}, el('label', {}, 'Ник'), el('input', {class: 'form-control', id: 'rNick', placeholder: 'Придумайте ник'})));
      body.appendChild(el('div', {class: 'form-group'}, el('label', {}, 'Тип аккаунта')));
      var rg = el('div', {class: 'radio-group'});
      [['buyer', 'Покупатель'], ['developer', 'Разработчик']].forEach(function(x, idx) {
        var it = el('div', {class: 'radio-item' + (idx === 0 ? ' selected' : ''), 'data-val': x[0]});
        it.addEventListener('click', function() {
          $$('.radio-item', rg).forEach(function(y) { y.classList.remove('selected'); });
          it.classList.add('selected');
        });
        it.appendChild(el('div', {class: 'radio-dot'}));
        it.appendChild(el('div', {class: 'radio-label'}, el('strong', {}, x[1])));
        rg.appendChild(it);
      });
      body.appendChild(rg);
      var regBtn = el('button', {class: 'btn btn-primary', style: 'width:100%;margin-top:10px'});
      regBtn.textContent = 'Зарегистрироваться';
      regBtn.addEventListener('click', function() {
        var nick = $('#rNick').value.trim();
        var roleEl = $('.radio-item.selected', rg);
        var role = roleEl ? roleEl.getAttribute('data-val') : 'buyer';
        if (!nick) { toast('Введите ник', '', 'error'); return; }
        if (nick.length < 3) { toast('Ник минимум 3 символа', '', 'error'); return; }
        registerWithNick(nick, role).then(function(result) {
          S.cu = {uid: result.uid, name: nick, nick: nick, role: result.role, avatar: nick[0], verified: false, official: false, blocked: false};
          localStorage.setItem('awer_nick', nick);
          saveSettings();
          closeModal();
          render();
          toast('Аккаунт создан!', nick, 'success');
        }).catch(function(err) { toast('Ошибка', err.message, 'error'); });
      });
      body.appendChild(regBtn);
      body.appendChild(el('p', {style: 'text-align:center;font-size:13px;color:var(--text2);margin-top:10px'}, 'Есть аккаунт? ', el('span', {style: 'color:var(--accent);cursor:pointer;font-weight:500', onclick: function() { mode = 'login'; rf(); }}, 'Войти')));
    }
  }
  rf();
  m.appendChild(head);
  m.appendChild(body);
  openModal(m);
}

function openScreenshotViewer(screenshots, currentSh) {
  var idx = -1;
  for (var i = 0; i < screenshots.length; i++) { if (screenshots[i].url === currentSh.url) { idx = i; break; } }
  if (idx < 0) idx = 0;
  var m = el('div', {});
  var head = el('div', {class: 'modal-head'}, el('h2', {}, 'Скриншот ' + (idx + 1) + ' из ' + screenshots.length), el('button', {class: 'modal-close', onclick: closeModal}, '✕'));
  var body = el('div', {});
  var imgWrap = el('div', {style: 'text-align:center;min-height:300px;display:flex;align-items:center;justify-content:center;background:var(--bg2);border-radius:12px;overflow:hidden'});
  body.appendChild(imgWrap);
  var nav = el('div', {style: 'display:flex;gap:8px;justify-content:center;margin-top:12px'});
  var prevBtn = el('button', {class: 'btn btn-outline btn-sm'});
  prevBtn.textContent = '← Назад';
  prevBtn.addEventListener('click', function() { idx = (idx - 1 + screenshots.length) % screenshots.length; show(); });
  nav.appendChild(prevBtn);
  var nextBtn = el('button', {class: 'btn btn-outline btn-sm'});
  nextBtn.textContent = 'Далее →';
  nextBtn.addEventListener('click', function() { idx = (idx + 1) % screenshots.length; show(); });
  nav.appendChild(nextBtn);
  body.appendChild(nav);
  function show() {
    var sh = screenshots[idx];
    imgWrap.innerHTML = '';
    imgWrap.appendChild(el('img', {src: sh.url, style: 'max-width:100%;max-height:500px'}));
    var h2 = head.querySelector('h2');
    if (h2) h2.textContent = 'Скриншот ' + (idx + 1) + ' из ' + screenshots.length;
  }
  show();
  m.appendChild(head);
  m.appendChild(body);
  openModal(m, true);
}
