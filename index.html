<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>awer</title>
<script>
(function(){
  var t = localStorage.getItem('awer_theme') || 'light';
  document.documentElement.setAttribute('data-theme', t);
})();
</script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap');

:root{
  --primary:#01875f;
  --primary-dark:#006b4b;
  --primary-light:#e8f5e9;
  --bg:#ffffff;
  --surface:#ffffff;
  --on-surface:#202124;
  --on-surface-variant:#5f6368;
  --outline:#dadce0;
  --outline-variant:#e8eaed;
  --shadow:0 1px 2px 0 rgba(60,64,67,0.3),0 1px 3px 1px rgba(60,64,67,0.15);
  --shadow-lg:0 1px 2px 0 rgba(60,64,67,0.3),0 2px 6px 2px rgba(60,64,67,0.15);
  --radius:8px;
  --radius-lg:16px;
  --radius-xl:24px;
}

[data-theme="dark"]{
  --bg:#202124;
  --surface:#2d2e30;
  --on-surface:#e8eaed;
  --on-surface-variant:#9aa0a6;
  --outline:#3c4043;
  --outline-variant:#5f6368;
  --shadow:0 1px 2px 0 rgba(0,0,0,0.3),0 1px 3px 1px rgba(0,0,0,0.15);
  --shadow-lg:0 1px 2px 0 rgba(0,0,0,0.3),0 2px 6px 2px rgba(0,0,0,0.15);
}

*{box-sizing:border-box;margin:0;padding:0}

html,body{
  background:var(--bg);
  color:var(--on-surface);
  font-family:'Roboto',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  min-height:100vh;
  font-size:14px;
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
}

button{
  font-family:inherit;
  cursor:pointer;
  border:none;
  background:none;
  color:inherit;
  font-size:14px;
  font-weight:500;
  letter-spacing:0.25px;
}

input,textarea,select{
  font-family:inherit;
  font-size:14px;
}

/* Header */
.header{
  position:sticky;
  top:0;
  z-index:100;
  background:var(--surface);
  border-bottom:1px solid var(--outline);
  padding:0 24px;
  height:64px;
  display:flex;
  align-items:center;
  gap:16px;
}

.logo{
  display:flex;
  align-items:center;
  gap:8px;
  font-size:22px;
  font-weight:500;
  color:var(--on-surface);
  cursor:pointer;
  text-decoration:none;
}

.logo-icon{
  width:32px;
  height:32px;
  background:var(--primary);
  border-radius:8px;
  display:flex;
  align-items:center;
  justify-content:center;
  color:#fff;
  font-weight:700;
  font-size:18px;
}

.search-bar{
  flex:1;
  max-width:720px;
  position:relative;
}

.search-bar input{
  width:100%;
  height:48px;
  padding:0 16px 0 48px;
  border:1px solid var(--outline);
  border-radius:24px;
  background:var(--surface);
  color:var(--on-surface);
  font-size:16px;
  transition:all 0.2s;
}

.search-bar input:focus{
  outline:none;
  border-color:var(--primary);
  box-shadow:0 0 0 2px rgba(1,135,95,0.2);
}

.search-bar::before{
  content:"🔍";
  position:absolute;
  left:16px;
  top:50%;
  transform:translateY(-50%);
  font-size:18px;
  opacity:0.6;
}

.header-actions{
  display:flex;
  align-items:center;
  gap:8px;
  margin-left:auto;
}

.icon-btn{
  width:40px;
  height:40px;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:20px;
  transition:background 0.2s;
}

.icon-btn:hover{
  background:var(--outline-variant);
}

.avatar{
  width:32px;
  height:32px;
  border-radius:50%;
  background:var(--primary);
  color:#fff;
  display:flex;
  align-items:center;
  justify-content:center;
  font-weight:500;
  font-size:14px;
  cursor:pointer;
}

/* Container */
.container{
  max-width:1280px;
  margin:0 auto;
  padding:0 24px;
}

/* Hero Banner */
.hero{
  margin:24px 0;
  border-radius:var(--radius-lg);
  background:linear-gradient(135deg,#e8f5e9 0%,#c8e6c9 100%);
  padding:48px;
  display:flex;
  align-items:center;
  gap:32px;
  overflow:hidden;
}

[data-theme="dark"] .hero{
  background:linear-gradient(135deg,#1b3a2a 0%,#2d5a3d 100%);
}

.hero-content{
  flex:1;
}

.hero-badge{
  display:inline-block;
  padding:6px 12px;
  background:rgba(1,135,95,0.1);
  color:var(--primary);
  border-radius:16px;
  font-size:12px;
  font-weight:500;
  margin-bottom:16px;
}

.hero h1{
  font-size:36px;
  font-weight:500;
  line-height:1.2;
  margin-bottom:12px;
  color:var(--on-surface);
}

.hero p{
  font-size:16px;
  color:var(--on-surface-variant);
  margin-bottom:24px;
}

.hero-cta{
  display:inline-flex;
  align-items:center;
  gap:8px;
  padding:12px 24px;
  background:var(--primary);
  color:#fff;
  border-radius:24px;
  font-size:14px;
  font-weight:500;
  transition:all 0.2s;
}

.hero-cta:hover{
  background:var(--primary-dark);
  box-shadow:var(--shadow);
}

.hero-image{
  font-size:120px;
  opacity:0.9;
}

/* Section */
.section{
  margin:32px 0;
}

.section-header{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:16px;
}

.section-title{
  font-size:20px;
  font-weight:500;
  color:var(--on-surface);
}

.section-more{
  color:var(--primary);
  font-size:14px;
  font-weight:500;
  cursor:pointer;
  padding:8px 16px;
  border-radius:20px;
  transition:background 0.2s;
}

.section-more:hover{
  background:var(--primary-light);
}

/* Chips */
.chips{
  display:flex;
  gap:8px;
  overflow-x:auto;
  padding-bottom:8px;
  margin-bottom:24px;
  scrollbar-width:none;
}

.chips::-webkit-scrollbar{
  display:none;
}

.chip{
  padding:8px 16px;
  border-radius:20px;
  background:var(--surface);
  color:var(--on-surface);
  font-size:14px;
  font-weight:500;
  cursor:pointer;
  white-space:nowrap;
  border:1px solid var(--outline);
  transition:all 0.2s;
}

.chip:hover{
  background:var(--outline-variant);
}

.chip.active{
  background:var(--primary-light);
  color:var(--primary);
  border-color:var(--primary);
}

/* App Grid */
.app-grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(180px,1fr));
  gap:24px;
}

.app-card{
  cursor:pointer;
  transition:transform 0.2s;
}

.app-card:hover{
  transform:translateY(-2px);
}

.app-icon{
  width:100%;
  aspect-ratio:1;
  border-radius:var(--radius-lg);
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:64px;
  margin-bottom:12px;
  overflow:hidden;
  box-shadow:var(--shadow);
}

.app-icon img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.app-name{
  font-size:14px;
  font-weight:500;
  color:var(--on-surface);
  margin-bottom:4px;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}

.app-meta{
  display:flex;
  align-items:center;
  gap:4px;
  font-size:12px;
  color:var(--on-surface-variant);
}

.app-rating{
  display:flex;
  align-items:center;
  gap:2px;
  font-size:12px;
  color:var(--on-surface-variant);
}

/* Carousel */
.carousel{
  display:flex;
  gap:16px;
  overflow-x:auto;
  padding-bottom:8px;
  scrollbar-width:none;
}

.carousel::-webkit-scrollbar{
  display:none;
}

.carousel .app-card{
  flex:0 0 180px;
}

/* Buttons */
.btn{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:8px;
  padding:10px 24px;
  border-radius:20px;
  font-size:14px;
  font-weight:500;
  letter-spacing:0.25px;
  transition:all 0.2s;
  border:none;
  cursor:pointer;
}

.btn-primary{
  background:var(--primary);
  color:#fff;
}

.btn-primary:hover{
  background:var(--primary-dark);
  box-shadow:var(--shadow);
}

.btn-outline{
  background:transparent;
  color:var(--primary);
  border:1px solid var(--primary);
}

.btn-outline:hover{
  background:var(--primary-light);
}

.btn-text{
  background:transparent;
  color:var(--primary);
  padding:8px 16px;
}

.btn-text:hover{
  background:var(--primary-light);
}

.btn-danger{
  background:#d93025;
  color:#fff;
}

.btn-danger:hover{
  background:#b3261e;
}

.btn-sm{
  padding:6px 16px;
  font-size:13px;
}

.btn-icon{
  width:40px;
  height:40px;
  padding:0;
  border-radius:50%;
}

/* App Page */
.app-page{
  padding:24px 0;
}

.app-header{
  display:grid;
  grid-template-columns:auto 1fr;
  gap:24px;
  align-items:start;
  margin-bottom:32px;
}

.app-header-icon{
  width:180px;
  height:180px;
  border-radius:var(--radius-lg);
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:80px;
  overflow:hidden;
  box-shadow:var(--shadow-lg);
}

.app-header-icon img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.app-header-info h1{
  font-size:32px;
  font-weight:500;
  margin-bottom:8px;
}

.app-header-info .developer{
  color:var(--primary);
  font-size:14px;
  font-weight:500;
  margin-bottom:16px;
  display:flex;
  align-items:center;
  gap:4px;
}

.app-stats{
  display:flex;
  gap:24px;
  padding:16px 0;
  border-bottom:1px solid var(--outline);
  margin-bottom:16px;
}

.app-stat{
  text-align:center;
}

.app-stat-value{
  font-size:16px;
  font-weight:500;
  margin-bottom:4px;
}

.app-stat-label{
  font-size:12px;
  color:var(--on-surface-variant);
}

.app-price{
  font-size:24px;
  font-weight:500;
  margin:16px 0;
}

.app-actions{
  display:flex;
  gap:12px;
  margin:16px 0;
  flex-wrap:wrap;
}

/* About Section */
.about-section{
  padding:24px 0;
  border-bottom:1px solid var(--outline);
}

.about-section h3{
  font-size:18px;
  font-weight:500;
  margin-bottom:16px;
}

.about-section p{
  color:var(--on-surface-variant);
  line-height:1.6;
  margin-bottom:12px;
}

/* Screenshots */
.screenshots{
  display:flex;
  gap:12px;
  overflow-x:auto;
  padding:8px 0;
  scrollbar-width:none;
}

.screenshots::-webkit-scrollbar{
  display:none;
}

.screenshot{
  flex:0 0 200px;
  height:360px;
  border-radius:var(--radius);
  background:var(--surface);
  border:1px solid var(--outline);
  overflow:hidden;
  cursor:pointer;
  transition:transform 0.2s;
}

.screenshot:hover{
  transform:scale(1.02);
}

.screenshot img{
  width:100%;
  height:100%;
  object-fit:cover;
}

/* Reviews */
.review{
  padding:16px 0;
  border-bottom:1px solid var(--outline-variant);
}

.review:last-child{
  border-bottom:none;
}

.review-header{
  display:flex;
  align-items:center;
  gap:12px;
  margin-bottom:8px;
}

.review-avatar{
  width:40px;
  height:40px;
  border-radius:50%;
  background:var(--outline-variant);
  display:flex;
  align-items:center;
  justify-content:center;
  font-weight:500;
  font-size:16px;
}

.review-author{
  font-weight:500;
  font-size:14px;
}

.review-date{
  font-size:12px;
  color:var(--on-surface-variant);
}

.review-text{
  color:var(--on-surface);
  line-height:1.6;
  margin-top:8px;
}

/* Modal */
.modal-overlay{
  position:fixed;
  inset:0;
  background:rgba(32,33,36,0.6);
  z-index:1000;
  display:none;
  align-items:center;
  justify-content:center;
  padding:24px;
  backdrop-filter:blur(4px);
}

.modal-overlay.active{
  display:flex;
}

.modal{
  background:var(--surface);
  border-radius:var(--radius-xl);
  max-width:560px;
  width:100%;
  max-height:90vh;
  overflow-y:auto;
  box-shadow:0 24px 38px 3px rgba(0,0,0,0.14),0 9px 46px 8px rgba(0,0,0,0.12),0 11px 15px -7px rgba(0,0,0,0.2);
}

.modal-header{
  padding:24px 24px 0;
  display:flex;
  align-items:center;
  justify-content:space-between;
}

.modal-header h2{
  font-size:24px;
  font-weight:500;
}

.modal-close{
  width:40px;
  height:40px;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:24px;
  transition:background 0.2s;
}

.modal-close:hover{
  background:var(--outline-variant);
}

.modal-body{
  padding:24px;
}

.modal-footer{
  padding:16px 24px 24px;
  display:flex;
  gap:8px;
  justify-content:flex-end;
}

/* Forms */
.form-group{
  margin-bottom:20px;
}

.form-group label{
  display:block;
  font-size:12px;
  font-weight:500;
  color:var(--on-surface-variant);
  margin-bottom:8px;
  letter-spacing:0.4px;
}

.form-control{
  width:100%;
  padding:12px 16px;
  border:1px solid var(--outline);
  border-radius:var(--radius);
  background:var(--surface);
  color:var(--on-surface);
  font-size:14px;
  transition:border-color 0.2s;
}

.form-control:focus{
  outline:none;
  border-color:var(--primary);
  box-shadow:0 0 0 2px rgba(1,135,95,0.2);
}

textarea.form-control{
  min-height:100px;
  resize:vertical;
}

/* Radio Group */
.radio-group{
  display:grid;
  gap:8px;
}

.radio-item{
  display:flex;
  align-items:center;
  gap:12px;
  padding:16px;
  border:1px solid var(--outline);
  border-radius:var(--radius);
  cursor:pointer;
  transition:all 0.2s;
}

.radio-item:hover{
  background:var(--outline-variant);
}

.radio-item.selected{
  border-color:var(--primary);
  background:var(--primary-light);
}

.radio-dot{
  width:20px;
  height:20px;
  border-radius:50%;
  border:2px solid var(--outline);
  position:relative;
  flex-shrink:0;
}

.radio-item.selected .radio-dot{
  border-color:var(--primary);
}

.radio-item.selected .radio-dot::after{
  content:"";
  position:absolute;
  inset:3px;
  background:var(--primary);
  border-radius:50%;
}

.radio-label strong{
  display:block;
  font-size:14px;
  font-weight:500;
  margin-bottom:2px;
}

.radio-label span{
  font-size:12px;
  color:var(--on-surface-variant);
}

/* Order Card */
.order-card{
  background:var(--surface);
  border:1px solid var(--outline);
  border-radius:var(--radius-lg);
  padding:16px;
  margin-bottom:12px;
  display:grid;
  grid-template-columns:56px 1fr auto;
  gap:16px;
  align-items:center;
  transition:box-shadow 0.2s;
}

.order-card:hover{
  box-shadow:var(--shadow);
}

.order-icon{
  width:56px;
  height:56px;
  border-radius:var(--radius);
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:28px;
  overflow:hidden;
}

.order-icon img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.order-info h4{
  font-size:14px;
  font-weight:500;
  margin-bottom:4px;
}

.order-info p{
  font-size:12px;
  color:var(--on-surface-variant);
  margin-bottom:2px;
}

.order-actions{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  justify-content:flex-end;
}

/* Chat */
.chat-container{
  max-width:800px;
  margin:0 auto;
}

.chat-header{
  background:var(--surface);
  border:1px solid var(--outline);
  border-radius:var(--radius-lg);
  padding:16px;
  margin-bottom:16px;
}

.chat-header h3{
  font-size:16px;
  font-weight:500;
  margin-bottom:8px;
}

.chat-messages{
  background:var(--surface);
  border:1px solid var(--outline);
  border-radius:var(--radius-lg);
  padding:16px;
  min-height:400px;
  max-height:500px;
  overflow-y:auto;
  display:flex;
  flex-direction:column;
  gap:8px;
}

.message{
  max-width:75%;
  padding:12px 16px;
  border-radius:18px;
  font-size:14px;
  line-height:1.4;
}

.message.me{
  align-self:flex-end;
  background:var(--primary);
  color:#fff;
  border-bottom-right-radius:4px;
}

.message.other{
  align-self:flex-start;
  background:var(--surface);
  border:1px solid var(--outline);
  border-bottom-left-radius:4px;
}

.message-time{
  font-size:10px;
  opacity:0.7;
  margin-top:4px;
  display:block;
}

.chat-input{
  display:flex;
  gap:8px;
  margin-top:12px;
}

.chat-input input{
  flex:1;
  padding:12px 16px;
  border-radius:24px;
  border:1px solid var(--outline);
  background:var(--surface);
  color:var(--on-surface);
  font-size:14px;
}

.chat-input input:focus{
  outline:none;
  border-color:var(--primary);
}

/* Profile */
.profile-grid{
  display:grid;
  grid-template-columns:280px 1fr;
  gap:24px;
  padding:24px 0;
}

.profile-card{
  background:var(--surface);
  border:1px solid var(--outline);
  border-radius:var(--radius-lg);
  padding:24px;
  text-align:center;
  height:fit-content;
}

.profile-avatar{
  width:80px;
  height:80px;
  border-radius:50%;
  background:var(--primary);
  color:#fff;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:32px;
  font-weight:500;
  margin:0 auto 16px;
}

.profile-card h3{
  font-size:20px;
  font-weight:500;
  margin-bottom:8px;
}

.profile-card p{
  font-size:14px;
  color:var(--on-surface-variant);
  margin-bottom:8px;
}

.profile-menu{
  display:grid;
  gap:4px;
  margin-top:20px;
}

.profile-menu button{
  padding:12px 16px;
  border-radius:var(--radius);
  text-align:left;
  font-size:14px;
  display:flex;
  align-items:center;
  gap:12px;
  transition:background 0.2s;
}

.profile-menu button:hover{
  background:var(--outline-variant);
}

.profile-menu button.active{
  background:var(--primary-light);
  color:var(--primary);
  font-weight:500;
}

/* Settings */
.settings-list{
  background:var(--surface);
  border:1px solid var(--outline);
  border-radius:var(--radius-lg);
  overflow:hidden;
}

.settings-item{
  padding:16px;
  display:flex;
  align-items:center;
  gap:16px;
  border-bottom:1px solid var(--outline-variant);
  cursor:pointer;
  transition:background 0.2s;
}

.settings-item:last-child{
  border-bottom:none;
}

.settings-item:hover{
  background:var(--outline-variant);
}

.settings-icon{
  font-size:24px;
  width:32px;
  text-align:center;
}

.settings-info{
  flex:1;
}

.settings-info strong{
  display:block;
  font-size:14px;
  font-weight:500;
  margin-bottom:2px;
}

.settings-info span{
  font-size:12px;
  color:var(--on-surface-variant);
}

.toggle{
  position:relative;
  width:40px;
  height:20px;
  background:var(--outline);
  border-radius:10px;
  cursor:pointer;
  transition:background 0.2s;
  flex-shrink:0;
}

.toggle.on{
  background:var(--primary);
}

.toggle::after{
  content:"";
  position:absolute;
  top:2px;
  left:2px;
  width:16px;
  height:16px;
  background:#fff;
  border-radius:50%;
  transition:left 0.2s;
  box-shadow:0 1px 2px rgba(0,0,0,0.2);
}

.toggle.on::after{
  left:22px;
}

/* Stats */
.stats-grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(160px,1fr));
  gap:16px;
  margin-bottom:24px;
}

.stat-card{
  background:var(--surface);
  border:1px solid var(--outline);
  border-radius:var(--radius-lg);
  padding:20px;
}

.stat-label{
  font-size:12px;
  color:var(--on-surface-variant);
  margin-bottom:8px;
}

.stat-value{
  font-size:28px;
  font-weight:500;
}

/* Toast */
.toast-container{
  position:fixed;
  bottom:24px;
  left:50%;
  transform:translateX(-50%);
  z-index:2000;
  display:flex;
  flex-direction:column;
  gap:8px;
  pointer-events:none;
}

.toast{
  background:#323232;
  color:#fff;
  border-radius:var(--radius);
  padding:14px 24px;
  display:flex;
  align-items:center;
  gap:12px;
  min-width:300px;
  box-shadow:0 6px 10px 0 rgba(0,0,0,0.14),0 1px 18px 0 rgba(0,0,0,0.12),0 3px 5px -1px rgba(0,0,0,0.2);
  animation:slideUp 0.3s;
  pointer-events:auto;
  font-size:14px;
}

@keyframes slideUp{
  from{transform:translateY(20px);opacity:0}
  to{transform:translateY(0);opacity:1}
}

/* Empty State */
.empty{
  text-align:center;
  padding:64px 24px;
  color:var(--on-surface-variant);
}

.empty-icon{
  font-size:64px;
  margin-bottom:16px;
  opacity:0.4;
}

.empty h3{
  font-size:20px;
  font-weight:500;
  color:var(--on-surface);
  margin-bottom:8px;
}

.empty p{
  font-size:14px;
  margin-bottom:24px;
}

/* Spinner */
.spinner{
  display:flex;
  align-items:center;
  justify-content:center;
  padding:48px;
}

.spinner::after{
  content:"";
  width:40px;
  height:40px;
  border:3px solid var(--outline);
  border-top-color:var(--primary);
  border-radius:50%;
  animation:spin 1s linear infinite;
}

@keyframes spin{
  to{transform:rotate(360deg)}
}

/* Footer */
.footer{
  background:var(--surface);
  border-top:1px solid var(--outline);
  padding:48px 0 24px;
  margin-top:64px;
}

.footer-grid{
  display:grid;
  grid-template-columns:2fr 1fr 1fr 1fr;
  gap:32px;
  margin-bottom:32px;
}

.footer h4{
  font-size:14px;
  font-weight:500;
  margin-bottom:16px;
}

.footer ul{
  list-style:none;
}

.footer ul li{
  font-size:14px;
  color:var(--on-surface-variant);
  cursor:pointer;
  margin-bottom:12px;
  transition:color 0.2s;
}

.footer ul li:hover{
  color:var(--primary);
}

.footer-bottom{
  padding-top:24px;
  border-top:1px solid var(--outline-variant);
  text-align:center;
  font-size:12px;
  color:var(--on-surface-variant);
}

.footer-warning{
  background:rgba(249,171,0,0.08);
  border:1px solid rgba(249,171,0,0.3);
  border-radius:var(--radius);
  padding:12px 16px;
  font-size:12px;
  color:#b06000;
  margin-bottom:24px;
  line-height:1.5;
}

/* Mobile Nav */
.mobile-nav{
  display:none;
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  background:var(--surface);
  border-top:1px solid var(--outline);
  padding:8px 0;
  z-index:100;
}

.mobile-nav-inner{
  display:flex;
  justify-content:space-around;
}

.mobile-nav-btn{
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:4px;
  padding:8px 16px;
  color:var(--on-surface-variant);
  font-size:11px;
}

.mobile-nav-btn.active{
  color:var(--primary);
}

.mobile-nav-btn .icon{
  font-size:20px;
}

/* Welcome */
.welcome-overlay{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,0.7);
  z-index:9999;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:24px;
  animation:fadeIn 0.3s;
}

@keyframes fadeIn{
  from{opacity:0}
  to{opacity:1}
}

.welcome-modal{
  background:var(--surface);
  border-radius:var(--radius-xl);
  max-width:560px;
  width:100%;
  padding:40px;
  text-align:center;
  box-shadow:0 24px 38px 3px rgba(0,0,0,0.14);
  animation:scaleIn 0.3s;
}

@keyframes scaleIn{
  from{transform:scale(0.9);opacity:0}
  to{transform:scale(1);opacity:1}
}

.welcome-icon{
  font-size:80px;
  margin-bottom:24px;
}

.welcome-modal h1{
  font-size:32px;
  font-weight:500;
  margin-bottom:16px;
}

.welcome-modal .subtitle{
  font-size:18px;
  margin-bottom:20px;
}

.welcome-modal .description{
  font-size:15px;
  color:var(--on-surface-variant);
  line-height:1.6;
  margin-bottom:32px;
}

.welcome-features{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
  margin-bottom:32px;
  text-align:left;
}

.welcome-feature{
  display:flex;
  align-items:center;
  gap:12px;
  padding:16px;
  background:var(--outline-variant);
  border-radius:var(--radius);
}

.welcome-feature-icon{
  font-size:28px;
}

.welcome-feature-text{
  font-size:14px;
}

/* Responsive */
@media(max-width:900px){
  .app-header{
    grid-template-columns:auto 1fr;
    gap:16px;
  }
  .app-header-icon{
    width:120px;
    height:120px;
    font-size:60px;
  }
  .hero{
    flex-direction:column;
    padding:32px;
    text-align:center;
  }
  .hero h1{
    font-size:28px;
  }
  .profile-grid{
    grid-template-columns:1fr;
  }
  .footer-grid{
    grid-template-columns:1fr 1fr;
  }
  .welcome-features{
    grid-template-columns:1fr;
  }
}

@media(max-width:720px){
  .header{
    padding:0 16px;
  }
  .container{
    padding:0 16px;
  }
  .mobile-nav{
    display:block;
  }
  body{
    padding-bottom:72px;
  }
  .app-grid{
    grid-template-columns:repeat(auto-fill,minmax(140px,1fr));
    gap:16px;
  }
  .hero h1{
    font-size:24px;
  }
  .footer-grid{
    grid-template-columns:1fr;
  }
}

function getOfficialUser() {
  return { uid: 'official', nick: OFFICIAL_NICK, name: OFFICIAL_NICK, role: 'developer', avatar: '', verified: true, official: true, blocked: false };
}

function registerWithNick(nick, role) {
  return new Promise(function(resolve, reject) {
    if (nick === OFFICIAL_NICK) { resolve(getOfficialUser()); return; }
    db.collection('users').where('nick', '==', nick).limit(1).get().then(function(snap) {
      if (!snap.empty) { reject(new Error('Ник занят')); return; }
      var uid = 'u' + Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
      db.collection('users').doc(uid).set({
        nick: nick, name: nick, role: role || 'buyer',
        avatar: nick[0], verified: false, official: false, blocked: false,
        createdAt: firebase.firestore.FieldValue.serverTimestamp()
      }).then(function() {
        resolve({ uid: uid, nick: nick, name: nick, role: role || 'buyer', avatar: nick[0], verified: false, official: false, blocked: false });
      }).catch(function(err) { reject(new Error(err.message)); });
    }).catch(function() { reject(new Error('Ошибка')); });
  });
}

function loginWithNick(nick) {
  return new Promise(function(resolve, reject) {
    if (nick === OFFICIAL_NICK) { resolve(getOfficialUser()); return; }
    db.collection('users').where('nick', '==', nick).limit(1).get().then(function(snap) {
      if (snap.empty) { reject(new Error('Не найден')); return; }
      var doc = snap.docs[0];
      var data = doc.data();
      if (data.blocked) { reject(new Error('Заблокирован')); return; }
      resolve({ uid: doc.id, nick: nick, name: data.name || nick, role: data.role || 'buyer', avatar: data.avatar || nick[0], verified: data.verified || false, official: false, blocked: data.blocked || false });
    }).catch(function() { reject(new Error('Ошибка')); });
  });
}

function compressImage(file, maxW) {
  maxW = maxW || 800;
  return new Promise(function(res, rej) {
    var r = new FileReader();
    r.onload = function(e) {
      var img = new Image();
      img.onload = function() {
        var w = img.width, h = img.height;
        if (w > maxW) { h = Math.round(h * maxW / w); w = maxW; }
        var c = document.createElement('canvas');
        c.width = w; c.height = h;
        c.getContext('2d').drawImage(img, 0, 0, w, h);
        c.toBlob(function(b) { if (!b) rej(new Error('Ошибка')); else res({blob: b, width: w, height: h}); }, 'image/jpeg', 0.85);
      };
      img.onerror = function() { rej(new Error('Не изображение')); };
      img.src = e.target.result;
    };
    r.onerror = function() { rej(new Error('Ошибка')); };
    r.readAsDataURL(file);
  });
}

function uploadToImgBB(file) {
  return new Promise(function(res, rej) {
    var fd = new FormData();
    fd.append('image', file);
    fd.append('key', IMGBB_KEY);

      .then(function(d) { if (d.success) res(d.data.url); else rej(new Error('Ошибка загрузки')); })
      .catch(rej);
  });
}

function rOrders() {
  var w = el('div', {class: 'container'});
  w.appendChild(el('div', {class: 'back-btn', onclick: function() { nav('home'); }}, '← Главная'));
  w.appendChild(el('h1', {style: 'font-size:28px;font-weight:500;margin-bottom:24px'}, 'Мои заявки'));
  if (!S.cu) { w.appendChild(el('div', {class: 'empty'}, el('div', {class: 'empty-icon'}, '🔐'), el('h3', {}, 'Войдите'))); return w; }

  var loading = el('div', {class: 'spinner'});
  w.appendChild(loading);

  db.collection('orders').where('buyerUid', '==', S.cu.uid).get().then(function(s1) {
    return db.collection('orders').where('devUid', '==', S.cu.uid).get().then(function(s2) {
      loading.remove();
      var orders = [];
      s1.forEach(function(d) { orders.push({id: d.id, ...d.data()}); });
      s2.forEach(function(d) {
        var o = {id: d.id, ...d.data()};
        var exists = false;
        for (var i = 0; i < orders.length; i++) { if (orders[i].id === o.id) { exists = true; break; } }
        if (!exists) orders.push(o);
      });
      orders.sort(function(a, b) { return (b.createdAt ? b.createdAt.seconds : 0) - (a.createdAt ? a.createdAt.seconds : 0); });

      if (orders.length === 0) { w.appendChild(el('div', {class: 'empty'}, el('div', {class: 'empty-icon'}, ''), el('h3', {}, 'Заявок нет'), el('p', {}, 'Оставьте заявку на приложение'))); return; }

      orders.forEach(function(o) {
        getAppById(o.appId, function(a) {

          var st = sm[o.status] || sm.new;
          var isB = o.buyerUid === S.cu.uid;

          else { c.appendChild(el('div', {class: 'order-icon', style: 'background:' + col(a.id)}, a.icon || '')); }
          var info = el('div', {class: 'order-info'});
          info.appendChild(el('h4', {}, a.name));
          info.appendChild(el('p', {}, isB ? 'Продавец: ' + (o.devName || '') : 'Покупатель: ' + (o.buyerName || '')));
          info.appendChild(el('p', {}, fd(o.createdAt)));
          info.appendChild(el('span', {class: 'status-badge ' + st[0]}, st[1]));
          c.appendChild(info);
          var ac = el('div', {class: 'order-actions'});
          if (o.status !== 'cancelled' && o.status !== 'completed') {
            ac.appendChild(el('button', {class: 'btn btn-primary btn-sm', onclick: function() { nav('chat', {orderId: o.id}); }}, 'Открыть чат'));
          }

function rChat() {
  var w = el('div', {class: 'container'});
  if (!S.cu) { w.appendChild(el('div', {class: 'empty'}, el('div', {class: 'empty-icon'}, '🔐'), el('h3', {}, 'Войдите'))); return w; }

    var isB = o.buyerUid === S.cu.uid;

    var cw = el('div', {class: 'chat-container'});

    hd.appendChild(el('div', {class: 'footer-warning', style: 'margin:12px 0 0'}, el('strong', {}, '️ '), 'awer не участвует в оплате. Если продавец обманул — напишите в поддержку.'));
    cw.appendChild(hd);

    var ms = el('div', {class: 'chat-messages', id: 'chatMsgs'});
    db.collection('orders').doc(orderId).collection('messages').orderBy('createdAt', 'asc').onSnapshot(function(snap) {
      ms.innerHTML = '';
      if (snap.empty) { ms.appendChild(el('div', {style: 'text-align:center;color:var(--on-surface-variant);padding:40px'}, 'Начните общение')); }
      snap.forEach(function(doc) {
        var m = doc.data();
        var me = m.senderUid === S.cu.uid;
        var msg = el('div', {class: 'message ' + (me ? 'me' : 'other')});
        if (!me) msg.appendChild(el('div', {class: 'message-author'}, m.senderName));
        msg.appendChild(el('div', {}, m.text));

        ms.appendChild(msg);
      });
      ms.scrollTop = ms.scrollHeight;
    });
    cw.appendChild(ms);

    if (o.status !== 'cancelled' && o.status !== 'completed') {
      var inp = el('div', {class: 'chat-input'});
      var input = el('input', {placeholder: 'Написать сообщение...'});
      var sendBtn = el('button', {class: 'btn btn-primary'});
      sendBtn.textContent = 'Отправить';
      sendBtn.addEventListener('click', function() {
        var t = input.value.trim();
        if (!t) return;
        db.collection('orders').doc(orderId).collection('messages').add({senderUid: S.cu.uid, senderName: S.cu.name, text: t, createdAt: firebase.firestore.FieldValue.serverTimestamp()});
        input.value = '';
        if (o.status === 'new' || o.status === 'accepted') {
          db.collection('orders').doc(orderId).update({status: 'discussion'});
        }
      });
      input.addEventListener('keydown', function(e) { if (e.key === 'Enter') sendBtn.click(); });

      cw.appendChild(inp);

          var btn = el('button', {class: 'btn btn-primary'});

          btn.addEventListener('click', function() {
            db.collection('orders').doc(orderId).update({buyerConfirmed: true});
            db.collection('orders').doc(orderId).collection('messages').add({senderUid: 'sys', senderName: 'Система', text: 'Покупатель подтвердил.', createdAt: firebase.firestore.FieldValue.serverTimestamp()});
            if (o.devConfirmed) {
              db.collection('orders').doc(orderId).update({status: 'completed'});
              var lib = JSON.parse(localStorage.getItem('awer_lib_' + S.cu.uid) || '{}');
              lib[o.appId] = {date: Date.now()};
              localStorage.setItem('awer_lib_' + S.cu.uid, JSON.stringify(lib));
              toast('Готово', 'Приложение в библиотеке', 'success');
            }
            toast('Подтверждено', '', 'success');
          });
          ac.appendChild(btn);
        } else {
          ac.appendChild(el('span', {class: 'status-badge status-verified'}, '✓ Вы подтвердили'));
        }
      } else {
        if (!o.devConfirmed) {

  var ssWrap = el('div', {});
  var ssInput = el('input', {type: 'file', id: 'f_screenshots', accept: 'image/*', multiple: 'multiple', class: 'form-control'});
  ssWrap.appendChild(ssInput);
  var ssProgress = el('div', {class: 'progress-bar', style: 'display:none'});
  var ssFill = el('div', {class: 'progress-fill', id: 'ssProgFill'});
  ssProgress.appendChild(ssFill);
  var ssText = el('div', {style: 'font-size:12px;color:var(--on-surface-variant);margin-top:8px', id: 'ssProgText'});
  ssWrap.appendChild(ssProgress);
  ssWrap.appendChild(ssText);
  var ssPreview = el('div', {class: 'ss-preview', id: 'ssPreview'});
  ssWrap.appendChild(ssPreview);
  gs.appendChild(ssWrap);
  f.appendChild(gs);

  var pendingScreenshots = [];

  ssInput.addEventListener('change', function(e) {
    var files = Array.from(e.target.files || []);
    if (files.length === 0) return;
    if (pendingScreenshots.length + files.length > 10) { toast('Максимум 10 скриншотов', '', 'error'); ssInput.value = ''; return; }
    ssProgress.style.display = 'block';
    var processed = 0;
    var total = files.length;
    function processNext() {
      if (processed >= total) {
        ssProgress.style.display = 'none';
        ssInput.value = '';
        renderSSPreview();
        toast('Скриншоты добавлены', total + ' шт.', 'success');
        return;
      }
      var file = files[processed];
      $('#ssProgText').textContent = 'Обработка ' + (processed + 1) + ' из ' + total;
      $('#ssProgFill').style.width = Math.round((processed / total) * 100) + '%';
      compressImage(file, 800).then(function(result) {
        uploadToImgBB(result.blob).then(function(url) {
          pendingScreenshots.push({url: url, name: file.name, size: result.blob.size, width: result.width, height: result.height});
          processed++;
          processNext();
        }).catch(function() { toast('Ошибка загрузки', file.name, 'error'); processed++; processNext(); });
      }).catch(function() { processed++; processNext(); });
    }
    processNext();
  });

  function renderSSPreview() {
    ssPreview.innerHTML = '';
    pendingScreenshots.forEach(function(sh, idx) {
      var thumb = el('div', {class: 'ss-thumb'});
      thumb.appendChild(el('img', {src: sh.url}));
      var rm = el('div', {class: 'rm'});
      rm.textContent = '';
      rm.addEventListener('click', function() { pendingScreenshots.splice(idx, 1); renderSSPreview(); });
      thumb.appendChild(rm);
      ssPreview.appendChild(thumb);
    });
  }

  var pubBtn = el('button', {class: 'btn btn-primary', style: 'margin-top:16px'});
  pubBtn.textContent = 'Опубликовать';
  pubBtn.addEventListener('click', function() {
    var name = $('#f_name').value.trim();
    var desc = $('#f_desc').value.trim();
    if (!name) { toast('Введите название', '', 'error'); return; }
    if (!desc) { toast('Введите описание', '', 'error'); return; }
    pubBtn.disabled = true;
    pubBtn.textContent = 'Публикация...';
    var iconFileEl = $('#f_iconFile');
    var iconFile = iconFileEl && iconFileEl.files ? iconFileEl.files[0] : null;
    var iconPromise = Promise.resolve(null);
    if (iconFile) { iconPromise = compressImage(iconFile, 200).then(function(r) { return uploadToImgBB(r.blob); }); }
    iconPromise.then(function(iconUrl) {
      var appData = {
        name: name, desc: desc, cat: $('#f_cat').value,
        price: parseInt($('#f_price').value) || 0,
        ver: $('#f_ver').value.trim() || '1.0.0',
        icon: $('#f_icon').value.trim() || '',
        iconUrl: iconUrl || null,
        fileUrl: $('#f_fileUrl').value.trim(),
        fileName: $('#f_fileName').value.trim(),
        devUid: S.cu.uid, devName: S.cu.name,
        devVerified: S.cu.verified || false,
        official: S.cu.official || false,
        installs: 0, rating: 0, reviews: 0,
        status: 'verified',
        screenshots: pendingScreenshots.slice(),
        createdAt: firebase.firestore.FieldValue.serverTimestamp()
      };
      db.collection('apps').add(appData).then(function() {
        pubBtn.disabled = false;
        pubBtn.textContent = 'Опубликовать';
        pendingScreenshots = [];
        toast('✓ Опубликовано', 'Приложение появилось в каталоге', 'success');
        nav('developer', {tab: 'apps'});
      }).catch(function(e) { pubBtn.disabled = false; pubBtn.textContent = 'Опубликовать'; toast('Ошибка', e.message, 'error'); });
    }).catch(function(e) { pubBtn.disabled = false; pubBtn.textContent = 'Опубликовать'; toast('Ошибка', e.message, 'error'); });
  });
  f.appendChild(pubBtn);
  return f;
}

    infoText.appendChild(el('div', {style: 'font-weight:500;margin-top:8px;font-size:18px'}, fp(a.price || 0)));
    info.appendChild(infoText);
    body.appendChild(info);
    body.appendChild(el('h3', {style: 'font-size:16px;font-weight:500;margin-bottom:12px'}, 'Способ оплаты'));
    var rg = el('div', {class: 'radio-group'});
    [['bank', 'Банковский перевод'], ['other', 'Другой способ'], ['discuss', 'Обсудить в чате']].forEach(function(x, idx) {
      var it = el('div', {class: 'radio-item' + (idx === 0 ? ' selected' : ''), 'data-val': x[0]});
      it.addEventListener('click', function() {
        $$('.radio-item', rg).forEach(function(y) { y.classList.remove('selected'); });
        it.classList.add('selected');
      });
      it.appendChild(el('div', {class: 'radio-dot'}));
      it.appendChild(el('div', {class: 'radio-label'}, el('strong', {}, x[1])));
      rg.appendChild(it);
    });
    body.appendChild(rg);
    body.appendChild(el('div', {class: 'footer-warning', style: 'margin-top:16px'}, el('strong', {}, '⚠️ '), 'awer не принимает платежи. Оплата в чате с продавцом.'));
    var foot = el('div', {class: 'modal-footer'});
    foot.appendChild(el('button', {class: 'btn btn-text', onclick: closeModal}, 'Отмена'));
    var submitBtn = el('button', {class: 'btn btn-primary'});
    submitBtn.textContent = 'Отправить';
    submitBtn.addEventListener('click', function() {
      var methodEl = $('.radio-item.selected', rg);
      var method = methodEl ? methodEl.getAttribute('data-val') : '';
      if (!method) { toast('Выберите способ', '', 'error'); return; }
      var names = {bank: 'Банковский перевод', other: 'Другой способ', discuss: 'Обсудить в чате'};
      db.collection('orders').add({appId: a.id, appName: a.name, appIcon: a.icon, appIconUrl: a.iconUrl, buyerUid: S.cu.uid, buyerName: S.cu.name, devUid: a.devUid, devName: a.devName, paymentMethod: names[method], status: 'new', price: a.price || 0, createdAt: firebase.firestore.FieldValue.serverTimestamp()}).then(function() {
        closeModal();
        toast('Отправлено', '', 'success');
        nav('orders');
      });
    });
    foot.appendChild(submitBtn);
    m.appendChild(body);
    m.appendChild(foot);
    openModal(m);
  });
}

function openReport(appId) {
  if (!S.cu) { showAuth(); return; }
  getAppById(appId, function(a) {
    if (!a) return;
    var m = el('div', {});
    m.appendChild(el('div', {class: 'modal-header'}, el('h2', {}, 'Пожаловаться'), el('button', {class: 'modal-close', onclick: closeModal}, '✕')));
    var body = el('div', {class: 'modal-body'});
    body.appendChild(el('p', {style: 'margin-bottom:16px'}, 'Приложение: ', el('strong', {}, a.name)));
    var rg = el('div', {class: 'radio-group'});
    ['Вирусы', 'Обман', 'Подделка', 'Нарушение правил', 'Другое'].forEach(function(r, idx) {
      var it = el('div', {class: 'radio-item' + (idx === 0 ? ' selected' : ''), 'data-val': r});
      it.addEventListener('click', function() {
        $$('.radio-item', rg).forEach(function(y) { y.classList.remove('selected'); });
        it.classList.add('selected');
      });
      it.appendChild(el('div', {class: 'radio-dot'}));
      it.appendChild(el('div', {class: 'radio-label'}, el('strong', {}, r)));
      rg.appendChild(it);
    });
    body.appendChild(rg);
    var foot = el('div', {class: 'modal-footer'});
    foot.appendChild(el('button', {class: 'btn btn-text', onclick: closeModal}, 'Отмена'));
    var submitBtn = el('button', {class: 'btn btn-danger'});
    submitBtn.textContent = 'Отправить';
    submitBtn.addEventListener('click', function() {
      var reasonEl = $('.radio-item.selected', rg);
      var reason = reasonEl ? reasonEl.getAttribute('data-val') : '';
      if (!reason) { toast('Выберите причину', '', 'error'); return; }
      db.collection('reports').add({appId: a.id, appName: a.name, appIcon: a.icon, userId: S.cu.uid, reason: reason, resolved: null, createdAt: firebase.firestore.FieldValue.serverTimestamp()}).then(function() {
        closeModal();
        toast('Отправлено', '', 'success');
      });
    });
    foot.appendChild(submitBtn);
    m.appendChild(body);
    m.appendChild(foot);
    openModal(m);
  });
}

function openScreenshotViewer(screenshots, currentSh) {
  var idx = -1;
  for (var i = 0; i < screenshots.length; i++) { if (screenshots[i].url === currentSh.url) { idx = i; break; } }
  if (idx < 0) idx = 0;
  var m = el('div', {});
  var head = el('div', {class: 'modal-header'}, el('h2', {}, 'Скриншот ' + (idx + 1) + ' из ' + screenshots.length), el('button', {class: 'modal-close', onclick: closeModal}, '✕'));
  var body = el('div', {class: 'modal-body'});
  var imgWrap = el('div', {style: 'text-align:center;min-height:400px;display:flex;align-items:center;justify-content:center;background:var(--outline-variant);border-radius:var(--radius-lg);overflow:hidden'});
  body.appendChild(imgWrap);
  var nav = el('div', {style: 'display:flex;gap:12px;justify-content:center;margin-top:16px'});
  var prevBtn = el('button', {class: 'btn btn-outline'});
  prevBtn.textContent = '← Назад';
  prevBtn.addEventListener('click', function() { idx = (idx - 1 + screenshots.length) % screenshots.length; show(); });
  nav.appendChild(prevBtn);
  var nextBtn = el('button', {class: 'btn btn-outline'});
  nextBtn.textContent = 'Далее →';
  nextBtn.addEventListener('click', function() { idx = (idx + 1) % screenshots.length; show(); });
  nav.appendChild(nextBtn);
  body.appendChild(nav);
  function show() {
    var sh = screenshots[idx];
    imgWrap.innerHTML = '';
    imgWrap.appendChild(el('img', {src: sh.url, style: 'max-width:100%;max-height:600px'}));
    var h2 = head.querySelector('h2');
    if (h2) h2.textContent = 'Скриншот ' + (idx + 1) + ' из ' + screenshots.length;
  }
  show();
  m.appendChild(head);
  m.appendChild(body);
  openModal(m, true);
}

  var hasSeen = localStorage.getItem('awer_welcome_seen');
  if (hasSeen) return;
  var overlay = document.createElement('div');
  overlay.className = 'welcome-overlay';
  overlay.innerHTML = '<div class="welcome-modal"><div class="welcome-icon">🎉</div><h1>Добро пожаловать в awer!</h1><div class="subtitle">Команда awer наконец-то сделала это!</div><div class="description">Мы создали маркетплейс, где разработчики могут публиковать свои приложения и игры, а пользователи — находить и покупать их напрямую у авторов.</div><div class="welcome-features"><div class="welcome-feature"><span class="welcome-feature-icon">📱</span><span class="welcome-feature-text">Тысячи приложений</span></div><div class="welcome-feature"><span class="welcome-feature-icon"></span><span class="welcome-feature-text">Безопасные сделки</span></div><div class="welcome-feature"><span class="welcome-feature-icon">💬</span><span class="welcome-feature-text">Прямой чат с продавцом</span></div><div class="welcome-feature"><span class="welcome-feature-icon">⚡</span><span class="welcome-feature-text">Мгновенная загрузка</span></div></div><button class="btn btn-primary" style="padding:14px 32px;font-size:16px" onclick="this.closest(\'.welcome-overlay\').remove();localStorage.setItem(\'awer_welcome_seen\',\'true\')">Начать исследование 🚀</button></div>';
  document.body.appendChild(overlay);
}

render();
