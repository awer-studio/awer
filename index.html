.features-list{list-style:none;display:grid;gap:8px;margin-top:12px}

.radio-group{display:grid;gap:8px}
.radio-item{display:flex;align-items:center;gap:12px;padding:14px;border:1px solid var(--border);border-radius:8px;cursor:pointer}

.radio-label strong{display:block;font-size:14px;font-weight:500;margin-bottom:2px}
.radio-label span{font-size:12px;color:var(--text2)}
.order-card{background:var(--bg);border:1px solid var(--border);border-radius:12px;padding:16px;margin-bottom:12px;display:grid;grid-template-columns:56px 1fr auto;gap:16px;align-items:center}
.order-icon{width:56px;height:56px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:28px;overflow:hidden}
.order-icon img{width:100%;height:100%;object-fit:cover}
.order-info h4{font-size:14px;font-weight:500;margin-bottom:4px}
.order-info p{font-size:12px;color:var(--text2);margin-bottom:2px}
.order-actions{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}

.chat-head{background:var(--bg);border:1px solid var(--border);border-radius:12px;padding:16px;margin-bottom:12px}

.chat-warning{background:rgba(249,171,0,.08);border:1px solid rgba(249,171,0,.3);border-radius:8px;padding:10px;font-size:12px;color:#b06000;margin-top:10px;line-height:1.5}
.chat-messages{background:var(--bg2);border:1px solid var(--border);border-radius:12px;padding:16px;min-height:400px;max-height:500px;overflow-y:auto;display:flex;flex-direction:column;gap:8px}
.msg{max-width:75%;padding:8px 14px;border-radius:18px;font-size:14px;line-height:1.4}
.msg.me{align-self:flex-end;background:var(--accent);color:#fff;border-bottom-right-radius:4px}
.msg.other{align-self:flex-start;background:var(--bg);border:1px solid var(--border);border-bottom-left-radius:4px}
.msg-time{font-size:10px;opacity:.7;margin-top:2px;display:block}

.chat-input{display:flex;gap:8px;margin-top:12px}

.toast{background:#323232;color:#fff;border-radius:8px;padding:12px 20px;display:flex;align-items:center;gap:10px;min-width:280px;box-shadow:0 4px 12px rgba(0,0,0,.3);animation:slideUp .3s;pointer-events:auto;font-size:14px}

.empty h3{font-size:18px;font-weight:500;color:var(--text);margin-bottom:6px}
.loading-spinner{display:flex;align-items:center;justify-content:center;padding:60px;color:var(--text2)}
.spinner{width:40px;height:40px;border:3px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@media(max-width:900px){.app-page-top{grid-template-columns:auto 1fr;gap:16px}.app-page-icon{width:120px;height:120px;font-size:60px;border-radius:24px}.hero-banner{flex-direction:column;padding:24px;text-align:center}.hero-icon{font-size:80px}.profile-grid{grid-template-columns:1fr}.footer-grid{grid-template-columns:1fr 1fr}}

const COLS = ['#e8f5e9','#e3f2fd','#fce4ec','#fff3e0','#f3e5f5','#e0f2f1','#fff8e1','#e8eaf6','#fbe9e7','#e0f7fa'];

function $(s, c) { return (c || document).querySelector(s); }
function $$(s, c) { return Array.from((c || document).querySelectorAll(s)); }

function el(tag, attrs, ...children) {
  const e = document.createElement(tag);
  if (attrs) {
    for (const k in attrs) {
      if (k === 'class') e.className = attrs[k];
      else if (k === 'style') e.style.cssText = attrs[k];
      else if (k.startsWith('on')) e.addEventListener(k.slice(2).toLowerCase(), attrs[k]);
      else if (k === 'html') e.innerHTML = attrs[k];
      else e.setAttribute(k, attrs[k]);
    }
  }
  const flatChildren = [];
  function flatten(arr) {
    for (let i = 0; i < arr.length; i++) {
      if (Array.isArray(arr[i])) flatten(arr[i]);
      else if (arr[i] != null) flatChildren.push(arr[i]);
    }
  }
  flatten(children);
  flatChildren.forEach(c => {
    e.append(c.nodeType ? c : document.createTextNode(String(c)));
  });
  return e;
}

function uid() { return Math.random().toString(36).slice(2, 10) + Date.now().toString(36); }
function fp(p) { return p === 0 ? 'Бесплатно' : (p ? p.toLocaleString('ru-RU') + ' ₽' : '0 ₽'); }
function fd(ts) { return ts && ts.seconds ? new Date(ts.seconds * 1000).toLocaleDateString('ru-RU', { day: 'numeric', month: 'short', year: 'numeric' }) : ''; }
function ft(ts) { return ts && ts.seconds ? new Date(ts.seconds * 1000).toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' }) : ''; }
function fsize(b) {
  if (!b) return '';
  if (b < 1024) return b + ' Б';
  if (b < 1024 * 1024) return (b / 1024).toFixed(1) + ' КБ';
  if (b < 1024 * 1024 * 1024) return (b / 1024 / 1024).toFixed(2) + ' МБ';
  return (b / 1024 / 1024 / 1024).toFixed(2) + ' ГБ';
}
function col(s) {
  let h = 0;
  for (let i = 0; i < s.length; i++) h = s.charCodeAt(i) + ((h << 5) - h);
  return COLS[Math.abs(h) % COLS.length];
}
function stars(n) {
  const f = Math.round(n || 0);
  return '★'.repeat(f) + '☆'.repeat(5 - f);
}

function toast(t, m, type) {
  const e = el('div', { class: 'toast ' + (type || 'info') },
    el('div', { class: 'toast-icon', html: type === 'success' ? '✓' : type === 'error' ? '✕' : 'ℹ' }),
    el('div', {}, el('strong', {}, t), m ? ' ' + m : '')
  );
  $('#toasts').append(e);
  setTimeout(() => {
    e.style.animation = 'slideUp .3s reverse';
    setTimeout(() => e.remove(), 300);
  }, 3000);
}

function compressImage(file, maxW) {
  maxW = maxW || 800;
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = function (e) {
      const img = new Image();
      img.onload = function () {
        let w = img.width, h = img.height;
        if (w > maxW) { h = Math.round(h * maxW / w); w = maxW; }
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, w, h);
        canvas.toBlob(function (blob) {
          if (!blob) reject(new Error('Не удалось сжать'));
          else resolve({ blob: blob, width: w, height: h });
        }, 'image/jpeg', 0.85);
      };
      img.onerror = () => reject(new Error('Не изображение'));
      img.src = e.target.result;
    };
    reader.onerror = () => reject(new Error('Не удалось прочитать'));
    reader.readAsDataURL(file);
  });
}

function uploadToImgBB(file) {
  return new Promise((resolve, reject) => {
    const formData = new FormData();
    formData.append('image', file);
    formData.append('key', IMGBB_KEY);
    fetch('https://api.imgbb.com/1/upload', { method: 'POST', body: formData })
      .then(r => r.json())
      .then(data => {
        if (data.success) resolve(data.data.url);
        else reject(new Error(data.error ? data.error.message : 'Ошибка загрузки'));
      })
      .catch(reject);
  });
}

auth.onAuthStateChanged(function (user) {
  if (user) {
    db.collection('users').doc(user.uid).get().then(function (doc) {
      if (doc.exists) {
        const data = doc.data();
        S.cu = { uid: user.uid, name: data.name, email: data.email, role: data.role || 'buyer', avatar: data.avatar || user.displayName || data.name[0], verified: data.verified || false, blocked: data.blocked || false };
      } else {
        S.cu = { uid: user.uid, name: user.displayName || 'Пользователь', email: user.email, role: 'buyer', avatar: (user.displayName || 'П')[0], verified: false, blocked: false };
      }
      if (S.cu.blocked) {
        auth.signOut();
        S.cu = null;
        toast('Аккаунт заблокирован', '', 'error');
      }
      saveSettings();
      render();
    }).catch(function () {
      S.cu = { uid: user.uid, name: user.displayName || 'Пользователь', email: user.email, role: 'buyer', avatar: (user.displayName || 'П')[0], verified: false, blocked: false };
      saveSettings(); render();
    });
  } else {
    S.cu = null;
    saveSettings();
    render();
  }
});

function saveSettings() {
  localStorage.setItem('awer_theme', S.theme);
  localStorage.setItem('awer_settings', JSON.stringify(S.settings));
}

function login(email, password) { return auth.signInWithEmailAndPassword(email, password); }
function register(name, email, password, role) {
  return auth.createUserWithEmailAndPassword(email, password).then(function (cred) {
    return cred.user.updateProfile({ displayName: name }).then(function () {
      return db.collection('users').doc(cred.user.uid).set({
        name: name, email: email, role: role || 'buyer', avatar: name[0], verified: false, blocked: false, createdAt: firebase.firestore.FieldValue.serverTimestamp()
      });
    });
  });
}

function getApps(callback) {
  db.collection('apps').where('status', '==', 'verified').orderBy('createdAt', 'desc').get()
    .then(snapshot => { const apps = []; snapshot.forEach(doc => apps.push({ id: doc.id, ...doc.data() })); callback(apps); })
    .catch(e => { console.error(e); callback([]); });
}

function getAppById(id, callback) {
  db.collection('apps').doc(id).get()
    .then(doc => { if (doc.exists) callback({ id: doc.id, ...doc.data() }); else callback(null); })
    .catch(() => callback(null));
}

  const loading = el('div', { class: 'loading-spinner' }, el('div', { class: 'spinner' }));
  w.append(loading);
  getApps(function (apps) {
    loading.remove();
    if (q) apps = apps.filter(a => a.name.toLowerCase().indexOf(q) >= 0 || (a.desc || '').toLowerCase().indexOf(q) >= 0);
    if (cat) apps = apps.filter(a => a.cat === cat);

    CATS.forEach(c => { ch.append(el('div', { class: 'chip' + (cat === c.id ? ' active' : ''), onclick: () => nav('catalog', { search: q, cat: c.id }) }, c.i + ' ' + c.n)); });

    else { const g = el('div', { class: 'app-list' }); apps.forEach(a => { g.append(rAppItem(a)); }); w.append(g); }

  return w;
}

  prevBtn.addEventListener('click', () => { idx = (idx - 1 + screenshots.length) % screenshots.length; show(); });
  nav.append(prevBtn);
  const nextBtn = el('button', { class: 'btn btn-outline btn-sm' }); nextBtn.textContent = 'Далее →';
  nextBtn.addEventListener('click', () => { idx = (idx + 1) % screenshots.length; show(); });
  nav.append(nextBtn);
  body.append(nav);
  function show() {
    const sh = screenshots[idx];
    imgWrap.innerHTML = '';
    imgWrap.append(el('img', { src: sh.url, style: 'max-width:100%;max-height:600px' }));
    const h2 = $('h2', m); if (h2) h2.textContent = 'Скриншот ' + (idx + 1) + ' из ' + screenshots.length;
  }
  show();
  m.append(body); openM(m, true);
}

saveSettings();
render();
</script>
</body>
</html>
